<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Launch">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0d1424; --night-2:#141d31;
  --ink:#eef2f8; --ink-2:#aab3c5; --ink-3:#6f7a91;
  --line:rgba(255,255,255,.09); --glass:rgba(255,255,255,.055);
  --sheet:rgba(21,30,51,.9); --bar:rgba(22,31,52,.72);
  --hi:rgba(255,255,255,.12); --field:rgba(255,255,255,.07); --shadow:rgba(3,6,15,.32);
  --dawn:#f2c46d; --dawn-ink:#1d1606; --danger:#ff6b61; --ok:#3ecf8e;
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  --sky:rgba(242,170,90,.24); --sky2:rgba(120,110,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--night);color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased;line-height:1.4}
body{transition:background .6s,color .6s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(130% 55% at 50% -12%,var(--sky) 0%,transparent 62%),radial-gradient(70% 45% at 105% 0%,var(--sky2),transparent 70%);transition:background 1.2s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--dawn);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}

.glass{background:var(--glass);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 32px var(--shadow);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}

.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 120px)}
@media(min-width:760px){.app{max-width:720px;padding-left:28px;padding-right:28px}}
@media(min-width:1000px){.app{max-width:1180px;padding-left:40px;padding-right:40px}
  .dayname{font-size:56px}
  .row{grid-template-columns:78px 6px minmax(0,1fr);column-gap:16px}
  .row .t{font-size:14px}
  .row .title{font-size:17px}
  .row.p3 .title{font-size:21px}
  .empty-day,.allday{margin-left:94px}
  .sec h3{font-size:20px}}
@media(min-width:1400px){.app{max-width:1360px}}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 20px}
.dayname{font-family:var(--serif);font-weight:400;font-size:46px;line-height:.95;letter-spacing:-.01em}
.daydate{color:var(--ink-2);font-size:15px;margin-top:6px}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink-2)}
.icon-btn svg{width:20px;height:20px}
.hdr-actions{display:flex;gap:8px}

.today-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media(min-width:1000px){.today-grid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:44px;align-items:start}}

/* briefing */
.brief{border-radius:26px;padding:22px 20px 16px}
.brief h2{font-family:var(--serif);font-weight:400;font-size:31px;line-height:1.08;margin-bottom:10px;text-wrap:balance}
.brief p{color:var(--ink-2);font-size:16px;line-height:1.5;max-width:62ch}
.brief .btn{margin-top:16px}
.brief.reveal{animation:rise .7s cubic-bezier(.2,.9,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.brief.thinking h2{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.focus{list-style:none;margin-top:14px;display:grid;gap:8px}
.focus li{display:flex;gap:10px;align-items:baseline;font-size:15px}
.focus li::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--dawn);flex:none;transform:translateY(-1px)}
.brief-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13px}
.brief-foot .stale{color:var(--dawn)}
.link-btn{color:var(--dawn);font-weight:600;font-size:14px;padding:6px 0;white-space:nowrap}

/* next up */
.next{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px 14px 14px;border-radius:18px;margin-top:14px;width:100%}
.next .rail{align-self:stretch;border-radius:3px;background:var(--c)}
.next .when{font-size:13px;color:var(--ink-2)}
.next .ttl{font-size:17px;font-weight:650;margin:2px 0}
.next .lead-l{font-size:13px;color:var(--dawn)}
.next .count{font-family:var(--serif);font-size:26px;line-height:1;text-align:right;color:var(--ink)}
.next .count small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-top:4px}

/* sections */
.sec{margin-top:28px}
.sec h3{font-size:18px;font-weight:650;margin-bottom:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h3{margin-bottom:6px}
.muted{color:var(--ink-3);font-size:14px}
.note-err{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(255,107,97,.1);color:#ffb3ad;font-size:14px}

/* lineup: the day rail */
.allday{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px 70px}
.chip{padding:6px 12px;border-radius:999px;font-size:13px;background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.row{display:grid;grid-template-columns:58px 5px minmax(0,1fr);column-gap:12px;width:100%;cursor:pointer}
.row .t{font-size:13px;color:var(--ink-2);padding-top:11px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.25}
.row .t small{display:block;color:var(--ink-3);font-size:11px}
.row .rail{border-radius:3px;background:var(--c);margin:3px 0}
.row .body{padding:9px 0 13px;min-width:0}
.row .title{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.row.p3 .body{padding:13px 14px;margin:3px 0;border-radius:16px;background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.row.p3 .title{font-size:19px;font-weight:700}
.row.p1 .title{font-size:15px;font-weight:500;color:var(--ink-2)}
.row.p1 .rail{opacity:.5}
.row.p1 .body{padding-bottom:9px}
.row.past{opacity:.42}
.row.live .sub{color:var(--dawn)}
.row.lead{cursor:default}
.row.lead .t{padding-top:5px;color:var(--ink-3)}
.row.lead .rail{background:repeating-linear-gradient(-45deg,var(--c) 0 3px,transparent 3px 7px);opacity:.85;margin:3px 0 0}
.row.lead .body{padding:4px 0 6px;font-size:13px;color:var(--ink-2);line-height:1.5}
.row.lead b{color:var(--ink);font-weight:600}
.log-btn{margin-top:8px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.logged{margin-top:6px;font-size:12px;color:var(--ok)}
.now{display:grid;grid-template-columns:58px minmax(0,1fr);column-gap:12px;align-items:center;margin:4px 0}
.now .t{color:var(--dawn);font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.now .line{height:2px;background:var(--dawn);border-radius:2px;position:relative;margin-left:-5px}
.now .line::before{content:'';position:absolute;left:0;top:50%;width:11px;height:11px;border-radius:50%;background:var(--dawn);transform:translate(-3px,-50%);box-shadow:0 0 0 5px rgba(242,196,109,.18)}
.empty-day{color:var(--ink-3);font-size:15px;padding:8px 0 0 70px}

/* coming up */
.heads{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;cursor:pointer;width:100%}
.heads .dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:5px}
.heads b{display:block;font-size:15px;font-weight:600}
.heads small{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:6px;border-radius:20px}
.sched-grid{display:grid;gap:8px}
@media(min-width:1000px){
  .sched-grid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:44px;align-items:start}
  .wd{padding:12px 0 13px}.wd b{font-size:22px}
  .week{padding:8px;gap:6px}}
.wd{display:grid;justify-items:center;gap:3px;padding:8px 0 9px;border-radius:14px;color:var(--ink-2)}
.wd span{font-size:11px}
.wd b{font-size:18px;font-weight:600;color:var(--ink)}
.wd i{display:flex;gap:3px;height:6px}
.wd i em{width:5px;height:5px;border-radius:50%;background:var(--c)}
.wd.today b{color:var(--dawn)}
.wd.on{background:var(--hi)}

/* goals */
.goal{padding:16px 16px 14px;border-radius:20px;margin-bottom:12px;cursor:pointer;display:block;width:100%}
.goal .gt{display:flex;align-items:center;gap:10px}
.goal .gt i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.goal h4{font-size:17px;font-weight:650;flex:1;min-width:0;overflow-wrap:anywhere}
.gnum{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.gnum .big{font-family:var(--serif);font-size:38px;line-height:1}
.gnum .of{color:var(--ink-2);font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--field);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .5s cubic-bezier(.2,.9,.2,1)}
.dots{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.dots span{width:30px;height:30px;border-radius:9px;background:var(--field);display:grid;place-items:center;font-size:11px;color:var(--ink-3)}
.dots span.hit{background:var(--c);color:#08101f;font-weight:700}
.dots span.today{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.dots button span{pointer-events:none}
.gfoot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--ink-3)}
.pace.behind{color:var(--dawn)}
.pace.done{color:var(--ok)}
.chk-btn{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:650;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);flex:none}
.chk-btn.on{background:var(--c);color:#08101f}
.mini{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.mini>div{flex:1;min-width:0}
.mini b{display:block;font-size:15px;font-weight:600}
.mini small{color:var(--dawn);font-size:13px}
.empty-card{padding:22px 20px;border-radius:20px;text-align:left}
.empty-card p{color:var(--ink-2);margin-bottom:14px}

/* reminders */
.qadd{display:flex;gap:6px;padding:6px 6px 6px 12px;border-radius:16px;align-items:center}
.qadd input{flex:1;min-width:0;background:transparent;border:0;padding:10px 2px;font-size:16px;outline:none}
.qadd input::placeholder{color:var(--ink-3)}
.qa-go{padding:10px 16px;border-radius:12px;background:var(--dawn);color:var(--dawn-ink);font-weight:700}
.qa-when{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.pill{padding:7px 13px;border-radius:999px;font-size:13px;border:1px solid var(--line);color:var(--ink-2)}
.pill.on{background:rgba(242,196,109,.16);border-color:rgba(242,196,109,.55);color:var(--ink)}
.rem{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:0}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;margin-top:1px}
.check svg{width:14px;height:14px}
.check.on{background:var(--ok);border-color:var(--ok);color:#06140d}
.rem-b{cursor:pointer;min-width:0}
.rem-t{font-size:16px;overflow-wrap:anywhere}
.rem.done .rem-t{color:var(--ink-3);text-decoration:line-through}
.flag{color:var(--dawn);font-weight:800}
.due{font-size:13px;color:var(--ink-3);margin-top:2px}
.due.late{color:var(--danger)}
.grp{margin-top:22px}
.grp h3{font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:2px}

/* tab bar */
.tabs{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;border-radius:999px;z-index:20;background:var(--bar)}
.tab-pill{position:absolute;top:6px;height:52px;border-radius:999px;background:var(--hi);opacity:0;
  transition:transform .42s cubic-bezier(.34,1.3,.5,1),width .42s cubic-bezier(.34,1.3,.5,1),opacity .2s;pointer-events:none;will-change:transform,width}
.tab-pill.on{opacity:1}
.tab{position:relative;width:64px;height:52px;border-radius:999px;display:grid;place-items:center;align-content:center;gap:2px;color:var(--ink-3);font-size:10px;font-weight:600;transition:color .3s}
.tab svg{width:22px;height:22px;transition:transform .42s cubic-bezier(.34,1.4,.5,1)}
.tab.on{color:var(--ink)}
.tab.on svg{transform:translateY(-1px) scale(1.06)}
.tab.add{width:52px;height:52px;background:var(--dawn);color:var(--dawn-ink);margin:0 6px}
.tab.add svg{width:24px;height:24px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(4,8,18,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90dvh;overflow:auto;overscroll-behavior:contain;border-radius:28px 28px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 26px);z-index:41;
  transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.2,1.02);background:var(--sheet);
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border-top:1px solid var(--line)}
.sheet.show{transform:none}
@media(min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;max-height:86dvh;border-radius:28px;border:1px solid var(--line);opacity:0;transform:translate(-50%,-46%) scale(.98);transition:transform .35s cubic-bezier(.2,.9,.2,1),opacity .2s;pointer-events:none}
  .sheet.show{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ink-3);margin:0 auto 14px}
.sheet h2{font-size:23px;font-weight:700;margin-bottom:4px;overflow-wrap:anywhere}
.sheet .lede{color:var(--ink-2);font-size:14px;margin-bottom:18px}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheet-h h2{flex:1;margin:0}
.set{padding:16px 0;border-bottom:1px solid var(--line)}
.set h3{font-size:16px;font-weight:650;margin-bottom:6px}
.set .muted{margin-bottom:12px}
.set-row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.set-row span{flex:1;min-width:0}
.set-row small{color:var(--ink-3)}

.field{display:grid;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;color:var(--ink-2)}
.inp{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;-webkit-appearance:none;appearance:none;min-height:46px}
.inp:focus{outline:none;border-color:rgba(242,196,109,.6)}
textarea.inp{resize:vertical;line-height:1.45}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--field);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:9px 4px;border-radius:9px;font-size:14px;color:var(--ink-2);text-align:center}
.seg button.on{background:var(--hi);color:var(--ink);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px}
.sw i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sw.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px;font-size:15px}
.switch input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--hi);position:relative;flex:none;transition:background .2s}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.2,.9,.2,1.2)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
details.more{margin:4px 0 14px;border:1px solid var(--line);border-radius:14px;padding:0 14px}
details.more summary{padding:13px 0;font-size:15px;color:var(--ink-2);cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:4px}
.ai-tag{font-size:12px;color:var(--ink-3);margin-left:6px;font-weight:400}

.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--dawn);color:var(--dawn-ink);font-weight:700;font-size:16px;text-align:center}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);font-weight:600}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn+.btn{margin-top:10px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.tpl{padding:13px 14px;border-radius:16px;background:color-mix(in srgb,var(--c) 11%,rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--c) 32%,transparent);min-width:0}
.tpl b{display:block;font-size:15px;font-weight:650;overflow-wrap:anywhere}
.tpl small{color:var(--ink-3);font-size:12px}
.ms{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ms .x{color:var(--ink-3);font-size:20px;line-height:1;padding:4px 8px}
.logs{margin-top:10px}
.logs div{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--line)}

/* detail sheet + checklists */
.det{display:grid;gap:10px;margin:2px 0 18px}
.det-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;font-size:15px;align-items:baseline}
.det-row span{color:var(--ink-3);font-size:13px}
.det-row b{font-weight:600;overflow-wrap:anywhere}
.det-row.hot b{color:var(--dawn)}
.ck{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ck:last-of-type{border-bottom:0}
.ck .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--ink-3);display:grid;place-items:center}
.ck .box svg{width:14px;height:14px}
.ck .box.on{background:var(--ok);border-color:var(--ok);color:#06140d}
.ck.done span{color:var(--ink-3);text-decoration:line-through}
.ck .x{color:var(--ink-3);font-size:20px;line-height:1;padding:2px 6px}
.ck-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 0 2px}
.ck-head h3{font-size:16px;font-weight:650}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.th{padding:12px 10px;border-radius:16px;border:1px solid var(--line);display:grid;gap:8px;justify-items:center;font-size:12px;color:var(--ink-2)}
.th .sw2{width:100%;height:34px;border-radius:10px;position:relative;overflow:hidden}
.th .sw2 i{position:absolute;right:7px;top:7px;width:14px;height:14px;border-radius:50%}
.th.on{border-color:var(--dawn);color:var(--ink)}
.rt{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px 6px;align-items:center;margin-bottom:8px}
.rt [data-f="time"]{grid-column:1}
.rt [data-f="days"]{grid-column:1}
@media(min-width:520px){.rt{grid-template-columns:minmax(0,1fr) 108px 120px 34px}
  .rt [data-f="time"],.rt [data-f="days"]{grid-column:auto}}
.rt .x{color:var(--ink-3);font-size:20px;padding:6px;grid-row:1;grid-column:-1}
.rt2{padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.rt2 .rt{margin-bottom:6px}
.rt-sub{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-right:0}
.rt-sub label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.rt-sub .inp{min-height:38px;padding:7px 10px;font-size:14px}
.rt .inp{min-height:42px;padding:9px 10px;font-size:15px}

/* month view */
.month{border-radius:22px;padding:14px 12px 8px;animation:unfold .42s cubic-bezier(.2,.9,.2,1) both;overflow:hidden}
@keyframes unfold{from{opacity:0;transform:scaleY(.82);transform-origin:top}to{opacity:1;transform:none}}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.mhead span{text-align:center;font-size:11px;color:var(--ink-3);font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.md{display:grid;justify-items:center;align-content:center;gap:4px;padding:9px 0 8px;border-radius:12px;min-height:46px}
.md b{font-size:15px;font-weight:600}
.md i{display:flex;gap:3px;height:5px}
.md i em{width:4px;height:4px;border-radius:50%;background:var(--c)}
.md.off{opacity:.3}
.md.today b{color:var(--dawn)}
.md.on{background:var(--hi)}
.mclose{display:block;width:100%;padding:12px 0 8px;font-size:13px;color:var(--ink-3);font-weight:600}
.week{position:relative;transform:scaleY(calc(1 + var(--pull,0) * .04));transition:transform .18s}
.pull-hint{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:10px;color:var(--ink-3);opacity:calc(.35 + var(--pull,0));pointer-events:none}
.sched-grid{margin-top:26px}

/* today: what's left */
.rest-h{font-size:18px;font-weight:650;margin:2px 0 10px}
.earlier{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 16px;border-radius:14px;
  background:var(--field);border:1px solid var(--line);color:var(--ink-3);font-size:14px;font-weight:600;margin-bottom:16px}
.earlier svg{width:17px;height:17px;transition:transform .3s}
.earlier.open svg{transform:rotate(180deg)}
.wrapped{padding:24px 20px;border-radius:20px;display:grid;gap:4px}
.wrapped b{font-family:var(--serif);font-weight:400;font-size:26px}
.wrapped span{color:var(--ink-2);font-size:15px}

/* sheet chrome */
.grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.5;margin:2px auto 14px;padding:0}
.sheet{padding-top:14px}
.sheet-x{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;display:none;place-items:center;color:var(--ink-3);background:var(--field)}
.sheet-x svg{width:17px;height:17px}
@media(min-width:760px){.sheet-x{display:grid}.grab{display:none}}
.sheet{overflow-x:hidden}
.sheet *{max-width:100%}

/* goal wizard */
.wiz{padding:4px 0 6px;min-height:270px;display:flex;flex-direction:column}
.wiz-dots{display:flex;gap:6px;margin-bottom:22px}
.wiz-dots i{width:22px;height:4px;border-radius:2px;background:var(--field);transition:background .3s}
.wiz-dots i.on{background:var(--dawn)}
.wiz-q{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-.01em;margin-bottom:8px;text-wrap:balance;animation:rise .45s cubic-bezier(.2,.9,.2,1) both}
.wiz-hint{color:var(--ink-3);font-size:14px;margin-bottom:18px}
.wiz-in{margin-bottom:12px;font-size:18px;padding:15px 16px}
.wiz-opts{display:grid;gap:9px;margin-bottom:14px}
.wiz-opt{display:flex;align-items:center;gap:11px;padding:16px 17px;border-radius:16px;border:1px solid var(--line);background:var(--field);font-size:16px;font-weight:600}
.wiz-opt i{width:11px;height:11px;border-radius:50%;flex:none}
.wiz-opt span{flex:1;min-width:0}
.wiz-opt em{font-style:normal;font-size:11px;font-weight:700;color:var(--dawn);padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--dawn) 16%,transparent)}
.wiz-opt.sug{border-color:color-mix(in srgb,var(--dawn) 50%,transparent)}

/* detail: give the facts room */
.when-card{display:grid;gap:3px;padding:15px 18px;border-radius:18px;margin:2px 0 12px;
  background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 26%,transparent)}
.when-card b{font-size:24px;font-weight:700;letter-spacing:-.01em}
.when-card span{font-size:14px;color:var(--ink-2)}
.addr{display:flex;align-items:center;gap:9px;padding:13px 15px;border-radius:16px;border:1px solid var(--line);
  background:var(--field);text-decoration:none;color:var(--ink);font-size:15px;margin-bottom:6px}
.addr svg{width:19px;height:19px;color:var(--dawn);flex:none}
.addr span{overflow-wrap:anywhere}
.det-row2{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.det-row2:last-child{border-bottom:0}
.det-row2>span{color:var(--ink-3);font-size:13px}
.det-row2 b{font-size:17px;font-weight:650;display:block}
.det-row2 small{display:block;color:var(--ink-3);font-size:13px;margin-top:2px;line-height:1.4}
.det-row2.hot b{color:var(--dawn)}
.row.lead .body b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.row.lead .body span{display:block;font-size:13px;color:var(--ink-3);margin-top:1px}

/* anchors + drag */
.row.anchor .rail{background:linear-gradient(var(--dawn),color-mix(in srgb,var(--dawn) 30%,transparent));opacity:.8}
.row.anchor .title{font-size:15px;font-weight:600;color:var(--ink-2)}
.row.wake .title{font-size:18px;font-weight:700;color:var(--ink)}
.row.wake .rail{background:var(--dawn);opacity:1}
.row .moved{font-style:normal;font-size:11px;font-weight:700;color:var(--dawn);margin-left:8px;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--dawn) 16%,transparent)}
.row[data-drag]{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row.dragging{position:relative;z-index:5;touch-action:none}
.row.dragging .body{background:var(--sheet);border-radius:16px;box-shadow:0 16px 40px var(--shadow);outline:1px solid var(--line)}
.row.dragging .title{color:var(--ink)}
.row.press{transition:transform .18s}
.row.press .body{transform:scale(.985)}
.drag-chip{position:fixed;z-index:70;left:50%;transform:translate(-50%,-50%);padding:9px 16px;border-radius:999px;background:var(--dawn);color:var(--dawn-ink);font-weight:800;font-size:16px;pointer-events:none;box-shadow:0 10px 30px var(--shadow);font-variant-numeric:tabular-nums}
.drag-hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);z-index:70;font-size:13px;color:var(--ink-2);background:var(--sheet);border:1px solid var(--line);padding:8px 14px;border-radius:999px;pointer-events:none;white-space:nowrap}

/* availability */
.av-day{margin-bottom:16px}
.av-day h4{font-size:15px;font-weight:650;margin-bottom:6px}
.av-win{display:inline-block;padding:7px 12px;border-radius:999px;font-size:14px;background:color-mix(in srgb,var(--ok) 15%,transparent);border:1px solid color-mix(in srgb,var(--ok) 38%,transparent);margin:0 6px 6px 0}
.av-none{font-size:14px;color:var(--ink-3)}
.av-prev{border-radius:18px;padding:16px;max-height:320px;overflow:auto;margin-bottom:16px}

/* unscheduled + tips */
.rem.uns{grid-template-columns:28px minmax(0,1fr) auto;align-items:center}
.find{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--dawn);border:1px solid color-mix(in srgb,var(--dawn) 45%,transparent);background:color-mix(in srgb,var(--dawn) 12%,transparent);white-space:nowrap;flex:none}
.find svg{width:15px;height:15px}
.tipc{display:grid;gap:3px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--dawn) 11%,transparent);border:1px solid color-mix(in srgb,var(--dawn) 26%,transparent);margin-top:10px}
.tipc b{font-size:13px;color:var(--dawn);font-weight:700}
.tipc span{font-size:15px;line-height:1.45}
.tip{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--dawn) 11%,transparent);border:1px solid color-mix(in srgb,var(--dawn) 26%,transparent);font-size:15px;margin:0 0 16px}
.goal.soon{opacity:.62}

/* login */
.login{min-height:calc(100dvh - 140px);display:grid;align-content:center;gap:14px;max-width:360px;margin:0 auto}
.login h1{font-family:var(--serif);font-weight:400;font-size:64px;line-height:.9}
.login p{color:var(--ink-2);margin-bottom:8px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translate(-50%,16px);opacity:0;padding:11px 16px;border-radius:14px;background:var(--sheet);border:1px solid var(--line);font-size:14px;z-index:60;transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.2,1);max-width:calc(100vw - 40px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(255,107,97,.5)}
.loading{color:var(--ink-3);padding:18px 0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
/* ============================================================
   Launch v1 — schedule by priority + prep, goals, reminders,
   and an AI morning game plan. Google Calendar is the data layer.
   ============================================================ */

// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16); }));
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sod = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const sow = (d) => addDays(sod(d), -((d.getDay() + 6) % 7)); // Monday
const todayKey = () => dayKey(new Date());
const hhmm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const localIso = (d) => `${dayKey(d)}T${hhmm(d)}`;
const atTime = (k, t) => { const d = parseDay(k); const [h, m] = t.split(':').map(Number); d.setHours(h, m, 0, 0); return d; };
const fmtT = (d) => { let h = d.getHours(); const m = d.getMinutes(); const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12; return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`; };
const fmtDur = (min) => { min = Math.max(0, Math.round(min)); if (min < 60) return `${min}m`; const h = Math.floor(min / 60), m = min % 60; return m ? `${h}h ${m}m` : `${h}h`; };
const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MO = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fmtDay = (d) => `${WD[d.getDay()].slice(0, 3)}, ${MO[d.getMonth()].slice(0, 3)} ${d.getDate()}`;
const relDay = (k) => {
  const n = new Date();
  if (k === dayKey(n)) return 'Today';
  if (k === dayKey(addDays(n, 1))) return 'Tomorrow';

  const s = n.toLocaleString(undefined, { maximumFractionDigits: 2 });

};
const ICON = {

// Google's event colors, brightened for a dark UI. Your scheme:

const CATS = {

const GOALCATS = {

  money: { name: 'Money', c: '#f6c945' },

const goalCat = (g) => GOALCATS[g.category] || GOALCATS.other;

// ---------- themes ----------
// Each theme sets its own surfaces AND its own sky, so light themes work too.

// ---------- api ----------
async function api(path, { method = 'GET', body } = {}) {
  const r = await fetch(path, {
    method,
    headers: { Authorization: `Bearer ${S.token}`, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let j = {};
  try { j = await r.json(); } catch {}
  if (r.status === 401) { signOut(); throw new Error(j.error || 'Signed out.'); }
  if (!r.ok) { const e = new Error(j.error || `Request failed (${r.status})`); e.code = j.code; throw e; }
  return j;
}
const saveRow = async (table, row) => (await api('/api/data', { method: 'POST', body: { action: 'upsert', table, row } })).row;
const delRow = (table, id) => api('/api/data', { method: 'POST', body: { action: 'delete', table, id } });

function upsertLocal(table, row) {
  const list = S.data[table];
  const i = list.findIndex((x) => x.id === row.id);
  if (i >= 0) list[i] = { ...list[i], ...row }; else list.push(row);
}
function removeLocal(table, id) { S.data[table] = S.data[table].filter((x) => x.id !== id); }

let toastTimer;
function toast(msg, err = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', err);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), err ? 4200 : 2200);
}

// ---------- sky follows the hour ----------
function setSky() {
  const h = new Date().getHours();
  const i = h < 5 ? 0 : h < 10 ? 1 : h < 16 ? 2 : h < 19 ? 3 : 4;
  const [a, b] = (THEMES[S.theme] || THEMES.midnight).skies[i];
  document.documentElement.style.setProperty('--sky', a);
  document.documentElement.style.setProperty('--sky2', b);
}

// ---------- events ----------
function normEv(e) {
  return { ...e, start: e.allDay ? parseDay(e.start) : new Date(e.start), end: e.allDay ? parseDay(e.end) : new Date(e.end) };
}
async function loadRange(d0, d1) {
  const j = await api(`/api/calendar?from=${encodeURIComponent(d0.toISOString())}&to=${encodeURIComponent(d1.toISOString())}`);
  const ids = new Set(j.events.map((e) => e.id));
  for (const [id, e] of S.events) if (e.start < d1 && e.end > d0 && !ids.has(id)) S.events.delete(id);
  for (const e of j.events) S.events.set(e.id, normEv(e));
}
function eventsOn(k) {
  const d0 = parseDay(k), d1 = addDays(d0, 1);
  return [...S.events.values()].filter((e) => e.start < d1 && e.end > d0).sort((a, b) => (b.allDay - a.allDay) || (a.start - b.start));
}
const pri = (e) => e.meta?.priority ?? 2;
function leadOf(e) {
  if (e.allDay || !e.meta) return null;
  const prep = e.meta.prep_min || 0, travel = e.meta.travel_min || 0;
  if (prep + travel === 0) return null;
  if (prep + travel < 15 && pri(e) < 3) return null;
  const leave = new Date(e.start - travel * 6e4);
  const ready = new Date(leave - prep * 6e4);
  return { prep, travel, ready, leave };
}
function headsUp() {
  const out = [];
  for (let i = 1; i <= 3; i++) {
    const k = dayKey(addDays(new Date(), i));
    for (const e of eventsOn(k)) {
      if (dayKey(e.start) !== k && !e.allDay) continue;
      if (pri(e) === 3 || (e.meta?.prep_min || 0) >= 45) out.push({ e, k });
    }
  }
  return out.slice(0, 5);
}
function freeGaps(k) {
  const d0 = parseDay(k), r = routines();
  const wake = anchorsOn(k).find((a) => a.id === 'wake')?.time || r.wake || '07:00';
  const w0 = atTime(k, wake);
  const w1 = atTime(k, r.day_end || '22:00');
  // A block runs from when he starts getting ready to when he is actually back home.
  const blocks = eventsOn(k).filter((e) => !e.allDay).map((e) => {
    const l = leadOf(e), back = (e.meta?.travel_min || 0) * 6e4;
    return [+(l ? l.ready : e.start), +e.end + back];
  }).sort((a, b) => a[0] - b[0]);
  const gaps = [];
  let cur = +w0;
  for (const [s, e] of blocks) {
    if (s - cur >= 30 * 6e4) gaps.push({ s: new Date(cur), e: new Date(Math.min(s, +w1)) });
    cur = Math.max(cur, e);
  }
  if (+w1 - cur >= 30 * 6e4) gaps.push({ s: new Date(cur), e: w1 });
  return gaps.filter((g) => g.e - g.s >= 30 * 6e4);
}

const routines = () => ({ ...DEF_ROUTINES, ...((S.data?.settings || []).find((x) => x.id === 'routines')?.value || {}) });
const anchorDays = (a) => (a.days === 'weekdays' ? 'Weekdays' : a.days === 'weekends' ? 'Weekends' : 'Every day');
const overrideFor = (k, id) => (S.data?.day_routines || []).find((o) => o.day === k && o.anchor_id === id);

// The wake-up block is an anchor like any other, it just comes from its own field.
function allAnchors() {
  const r = routines();
  return [{ id: 'wake', label: 'Good morning', time: r.wake || '06:00', days: 'all', mins: +r.morning_min || 10, travel_min: 0 }]
    .concat((r.anchors || []).filter((a) => a.time && a.label).map((a) => ({ ...a, mins: +a.mins || 0, travel_min: +a.travel_min || 0 })));
}
// Anchors for one day, with that day's drags applied. Never touches Google.
function anchorsOn(k) {
  const dow = parseDay(k).getDay(), wknd = dow === 0 || dow === 6;
  return allAnchors()
    .filter((a) => a.days === 'all' || (a.days === 'weekdays' && !wknd) || (a.days === 'weekends' && wknd))
    .map((a) => { const o = overrideFor(k, a.id); return o ? { ...a, time: o.time || a.time, hidden: o.hidden } : a; })
    .filter((a) => !a.hidden && a.time)
    .sort((a, b) => a.time.localeCompare(b.time));
}
async function moveAnchor(k, id, time) {
  const row = { id: `${k}:${id}`, day: k, anchor_id: id, time, hidden: false };
  const prev = overrideFor(k, id);
  upsertLocal('day_routines', row); render();
  try { await saveRow('day_routines', row); S.briefing = null; ensureBriefing(); }
  catch (err) { if (prev) upsertLocal('day_routines', prev); else removeLocal('day_routines', row.id); render(); toast(err.message, true); }
}
async function resetAnchor(k, id) {
  const o = overrideFor(k, id);
  if (!o) return;
  removeLocal('day_routines', o.id); render();
  try { await delRow('day_routines', o.id); S.briefing = null; ensureBriefing(); } catch (err) { upsertLocal('day_routines', o); render(); toast(err.message, true); }

// One place that answers: where should this goal be, and where is it?
function goalStatus(g) {
  const logs = logsOf(g.id), t = todayKey(), sk = startKey(g);
  const base = { pct: 0, behind: false, pace: '', text: '', notStarted: notStarted(g), projected: null, need: '' };
  if (base.notStarted) {
    const d = Math.round((parseDay(sk) - sod(new Date())) / 864e5);
    base.pace = `Starts ${relDay(sk)}${d > 1 ? `, ${d} days out` : ''}`;
  }

  if (g.type === 'number' || g.type === 'milestone') {
    let cur, tgt, start, text;
    if (g.type === 'number') {
      start = +g.start_value || 0; tgt = +g.target || 0; cur = +g.current || 0;
      text = `${fmtNum(cur, g.unit)} of ${fmtNum(tgt, g.unit)}`;
    } else {
      const ms = msOf(g.id);
      start = 0; tgt = ms.length; cur = ms.filter((m) => m.done).length;
      text = `${cur} of ${tgt} done`;
    }
    const pct = tgt === start ? 0 : Math.max(0, Math.min(1, (cur - start) / (tgt - start)));
    const left = Math.max(0, tgt - cur);
    const done = pct >= 1 && tgt > start;
    const out = { ...base, pct, text };
    if (done) return { ...out, pace: 'Done', pct: 1 };
    if (base.notStarted) return out;

    if (g.pace_mode === 'rate' && +g.rate > 0) {
      const weeks = left / +g.rate;
      const proj = addDays(new Date(), Math.ceil(weeks * 7));
      out.projected = dayKey(proj);
      out.need = `${fmtNum(g.rate, g.unit)} a week`;
      out.behind = !!g.deadline && out.projected > g.deadline;
      out.pace = g.deadline && out.behind ? `Finishing ${fmtDay(proj)}, past your deadline` : `On track to finish ${fmtDay(proj)}`;
      return out;
    }
    if (g.deadline) {
      const total = weeksBetween(sk, g.deadline), gone = weeksBetween(sk, t);
      const expect = total <= 0 ? 1 : Math.max(0, Math.min(1, gone / total));
      const weeksLeft = Math.max(0, weeksBetween(t, g.deadline));
      out.behind = pct < expect - 0.08;
      out.need = weeksLeft > 0 ? `${fmtNum(Math.ceil((left / weeksLeft) * 100) / 100, g.unit)} a week` : `${fmtNum(left, g.unit)} left`;
      out.pace = weeksLeft <= 0 ? 'Deadline passed' : out.behind ? `Behind, needs ${out.need}` : `On pace, ${out.need}`;
      return out;
    }
    out.pace = g.type === 'milestone' ? (msOf(g.id).find((m) => !m.done) ? `Next: ${msOf(g.id).find((m) => !m.done).title}` : 'Add steps to track') : 'No deadline set';
    return out;
  }

  // streak
  const days = new Set(logs.map((l) => l.day));
  if (g.frequency === 'weekly') {
    const ws = sow(new Date());
    let n = 0;
    for (let i = 0; i < 7; i++) if (days.has(dayKey(addDays(ws, i)))) n++;
    const need = Math.max(1, +g.per_week || 3);
    const leftDays = 7 - ((new Date().getDay() + 6) % 7);
    let weeks = n >= need ? 1 : 0;
    for (let w = 1; w < 60; w++) {
      const st = addDays(ws, -7 * w);
      let c = 0;
      for (let i = 0; i < 7; i++) if (days.has(dayKey(addDays(st, i)))) c++;
      if (c >= need) weeks++; else break;
    }
    const out = { ...base, pct: Math.min(1, n / need), n, need, weeks, text: `${n} of ${need} this week` };
    if (base.notStarted) return out;
    out.behind = n < need && need - n >= leftDays;
    out.pace = n >= need ? 'Week done' : out.behind ? `Need ${need - n} more, ${leftDays} day${leftDays === 1 ? '' : 's'} left` : `${need - n} to go this week`;
    return out;
  }
  let d = new Date();
  if (!days.has(dayKey(d))) d = addDays(d, -1);
  let n = 0;
  while (days.has(dayKey(d))) { n++; d = addDays(d, -1); }
  const doneToday = days.has(t);
  const out = { ...base, pct: doneToday ? 1 : 0, n, text: n === 1 ? '1 day' : `${n} days` };
  if (base.notStarted) return out;
  out.behind = !doneToday;
  out.pace = doneToday ? 'Done today' : 'Not yet today';
  return out;
}

async function toggleCheckin(g, day, note = '') {
  const existing = logsOf(g.id).find((l) => l.day === day);
  if (existing) {
    removeLocal('logs', existing.id); render();
    try { await delRow('logs', existing.id); } catch (e) { upsertLocal('logs', existing); render(); toast(e.message, true); }
  } else {
    const row = { id: uid(), goal_id: g.id, day, value: 1, note };
    upsertLocal('logs', row); render();
    try { await saveRow('logs', row); } catch (e) { removeLocal('logs', row.id); render(); toast(e.message, true); }
  }
}
async function addToNumber(g, delta, note = '') {
  const before = g.current;
  g.current = (+g.current || 0) + delta;
  const log = { id: uid(), goal_id: g.id, day: todayKey(), value: delta, note };
  upsertLocal('logs', log); render();
  try { await saveRow('goals', g); await saveRow('logs', log); }
  catch (e) { g.current = before; removeLocal('logs', log.id); render(); toast(e.message, true); }
}
function eventLogged(e, g) {
  const logs = logsOf(g.id);
  if (logs.some((l) => l.note === `event:${e.id}`)) return true;
  return g.type === 'streak' && logs.some((l) => l.day === dayKey(e.start));
}
async function logFromEvent(e) {
  const g = goalById(e.goalId);
  if (!g || eventLogged(e, g)) return;
  if (g.type === 'number') await addToNumber(g, +g.step || 1, `event:${e.id}`);
  else if (g.type === 'streak') await toggleCheckin(g, dayKey(e.start), `event:${e.id}`);
  toast(`Logged to ${g.title}`);
}

const remSort = (a, b) => (a.due_date || '9').localeCompare(b.due_date || '9') || (a.due_time || '99').localeCompare(b.due_time || '99') || (b.priority - a.priority);

// Real open windows across the next 7 days, in the AI's format.
function openWindows(days = 7) {
  const out = [];
  for (let i = 0; i < days; i++) {
    const k = dayKey(addDays(new Date(), i));
    for (const g of freeGaps(k)) {
      if (i === 0 && g.e < new Date()) continue;
      const s0 = i === 0 && g.s < new Date() ? new Date(Math.ceil(Date.now() / 18e5) * 18e5) : g.s;

const AV_RANGES = {

function avDays(range) {

  if (range === 'next7') { for (let i = 0; i < 7; i++) out.push(dayKey(addDays(today, i))); return out; }
  if (range === 'week') { let d = new Date(today); while (out.length < 8) { out.push(dayKey(d)); if (d.getDay() === 0) break; d = addDays(d, 1); } return out; }

// Draws the card at 2x so it stays sharp in Messages.
function avCanvas(range) {
  const days = availability(range), t = THEMES[S.theme] || THEMES.midnight;

    x.fillText(`${WD[parseDay(r.d.k).getDay()]}, ${MO[parseDay(r.d.k).getMonth()].slice(0, 3)} ${parseDay(r.d.k).getDate()}`, P, y + 26);
    y += 44;
    for (const line of r.lines) {
      const open = line !== 'Booked up';
      const w = x.measureText(line).width + 44;
      x.fillStyle = open ? (dark ? 'rgba(62,207,142,.17)' : 'rgba(30,150,100,.14)') : (dark ? 'rgba(255,255,255,.05)' : 'rgba(20,30,50,.05)');
      roundRect(x, P, y, Math.max(240, w), 42, 21); x.fill();
      x.strokeStyle = open ? (dark ? 'rgba(62,207,142,.45)' : 'rgba(30,150,100,.35)') : t.v.line;
      x.lineWidth = 1.5; roundRect(x, P, y, Math.max(240, w), 42, 21); x.stroke();
      x.fillStyle = open ? t.v.ink : t.v['ink-3'];
      x.font = '25px -apple-system, "Helvetica Neue", Arial, sans-serif';
      x.fillText(line, P + 22, y + 29);
      y += 52;
    }
    y += 22;
  }
  x.fillStyle = t.v['ink-3'];

}

  let leadLine = '';
  if (!live && l) leadLine = `<div class="lead-l">${l.prep ? `Get ready by ${fmtT(l.ready)}` : ''}${l.prep && l.travel ? ', ' : ''}${l.travel ? `leave by ${fmtT(l.leave)}` : ''}</div>`;
  return `<div class="next glass" style="--c:${c}" role="button" tabindex="0" data-act="ev" data-id="${esc(e.id)}">
    <span class="rail"></span>
    <div><div class="when">${live ? `Now, until ${fmtT(e.end)}` : `Next at ${fmtT(e.start)}`}</div><div class="ttl">${esc(e.title)}</div>${leadLine}</div>
    <div class="count">${fmtDur(Math.max(0, mins))}<small>${countLabel}</small></div>

}
function lineupHTML(k, opt = {}) {
  const list = eventsOn(k), all = list.filter((e) => e.allDay), timed = list.filter((e) => !e.allDay);
  const now = new Date(), isToday = k === todayKey();
  let h = '';
  if (all.length) h += `<div class="allday">${all.map((e) => `<button class="chip" style="--c:${catOf(e.colorId).c}" data-act="ev" data-id="${esc(e.id)}">${esc(e.title)}</button>`).join('')}</div>`;

  // Anchors, get-ready rows and events all sort on their own time, so nothing
  // ends up visually out of order.
  const items = [];
  for (const a of anchorsOn(k)) {
    items.push({ kind: 'anchor', a, at: +atTime(k, a.time) });
    if (a.travel_min) items.push({ kind: 'leave', a, at: +atTime(k, a.time) - a.travel_min * 6e4 });
  }
  const leaveTimes = items.filter((i) => i.kind === 'leave').map((i) => i.at);
  for (const e of timed) {
    const l = leadOf(e);
    // If an anchor already told you when to leave for roughly this, don't say it twice.
    const covered = l && leaveTimes.some((t) => Math.abs(t - +l.ready) < 40 * 6e4);
    if (l && !covered && e.end >= now && dayKey(l.ready) === k) items.push({ kind: 'lead', e, l, at: +l.ready });
    items.push({ kind: 'event', e, at: +e.start });
  }
  items.sort((x, y) => x.at - y.at || (x.kind === 'event' ? 1 : 0) - (y.kind === 'event' ? 1 : 0));
  if (!items.length) return h + `<p class="empty-day">${all.length ? 'Nothing else scheduled.' : 'Nothing on the calendar.'} <button class="link-btn" data-act="add">Add something</button></p>`;

  // On Today, everything that's finished folds away so the screen is only what's left.
  const isDone = (it) => (it.kind === 'event' ? it.e.end < now : it.at < +now);
  const rest = opt.rest && isToday;
  const past = rest && !S.showPast ? items.filter(isDone) : [];
  const live = rest && !S.showPast ? items.filter((it) => !isDone(it)) : items;

  const draw = (it) => {
    if (it.kind === 'anchor') return anchorRowHTML(k, it.a, now);
    if (it.kind === 'leave') return leaveRowHTML(k, it.a);
    if (it.kind === 'lead') return leadRowHTML(it.e, it.l);
    return evRow(it.e, catOf(it.e.colorId).c, it.e.end < now, now);
  };

  if (rest) {
    if (past.length) h += `<button class="earlier" data-act="show-past"><span>${past.length} earlier today</span>${ICON.down}</button>`;
    else if (S.showPast && items.some(isDone)) h += `<button class="earlier open" data-act="hide-past"><span>Hide what's done</span>${ICON.down}</button>`;
    if (!live.length) {
      return h + `<div class="wrapped glass"><b>That's the day.</b><span>Nothing left on the calendar.</span></div>`;
    }
    h += `<h3 class="rest-h">What's left</h3>`;
    if (S.showPast) { for (const it of items.filter(isDone)) h += draw(it); h += nowHTML(now); }
    for (const it of live) h += draw(it);
    return h;
  }

  let placed = !isToday;
  for (const it of items) {
    if (!placed && it.at > +now) { h += nowHTML(now); placed = true; }
    h += draw(it);
  }
  if (!placed) h += nowHTML(now);
  return h;
}

// The rest of the week, for screens with room for it
function stepSchedule(dir) {
  if (S.month) {
    const a = parseDay(S.selDay);
    const d = new Date(a.getFullYear(), a.getMonth() + dir, 1);
    S.selDay = dayKey(d); S.weekStart = sow(d);
    for (let i = 0; i < 6; i++) ensureWeek(addDays(sow(d), i * 7));

    S.weekStart = addDays(S.weekStart, 7 * dir);

  }

  const a = parseDay(S.selDay), start = sow(new Date(a.getFullYear(), a.getMonth(), 1));

}

async function saveEventForm(btn) {
  const title = val('ef-title');
  if (!title) return toast('Give it a title first.', true);
  const date = val('ef-date');
  if (!date) return toast('Pick a date.', true);
  const allDay = !!$('#ef-allday')?.checked;
  const tpl = draft?.tpl;
  let start, end, s, e;
  if (allDay) { start = date; end = dayKey(addDays(parseDay(date), 1)); }
  else {
    const st = val('ef-start'), en = val('ef-end');
    if (!st || !en) return toast('Set a start and end time.', true);
    s = atTime(date, st); e = atTime(date, en);
    if (e <= s) e = addDays(e, 1);
    start = localIso(s); end = localIso(e);
  }
  const p = Number(segVal('ef-pri')) || 0;
  const prep = num('ef-prep'), travel = num('ef-travel'), note = val('ef-note');
  let meta = null;
  const checklist = tpl?.checklist || [];
  if (p > 0) meta = { priority: p, prep_min: prep, travel_min: travel, prep_note: note, checklist, source: tpl ? 'template' : 'manual' };
  else if (prep || travel || note || checklist.length) meta = { priority: 2, prep_min: prep, travel_min: travel, prep_note: note, checklist, source: tpl ? 'template' : 'manual' };
  const travelBlock = !allDay && $('#ef-block')?.checked && travel > 0
    ? { start: localIso(new Date(s - travel * 6e4)), end: start, title: `Drive: ${title}` } : null;
  btn.disabled = true; btn.textContent = 'Adding…';
  try {
    const j = await api('/api/calendar', { method: 'POST', body: { action: 'create', event: { title, start, end, allDay, colorId: segVal('ef-color'), location: val('ef-loc'), goalId: val('ef-goal') || null, templateId: tpl?.id || null }, meta, travel: travelBlock } });
    S.events.set(j.event.id, normEv(j.event));
    if (j.travel) S.events.set(j.travel.id, normEv(j.travel));
    closeSheet(); S.briefing = null; render(); toast('Added to calendar');
    runTriage();
  } catch (err) { btn.disabled = false; btn.textContent = 'Add to calendar'; toast(err.message, true); }
}

// Checklist ticks save against the event (or the whole series for repeats).
async function saveChecklist(id, next) {
  const e = S.events.get(id);
  if (!e) return;
  const before = e.meta;
  const meta = { priority: pri(e), prep_min: e.meta?.prep_min || 0, travel_min: e.meta?.travel_min || 0, prep_note: e.meta?.prep_note || '', checklist: next };
  for (const x of S.events.values()) if (x.metaKey === e.metaKey) x.meta = { ...(x.meta || {}), ...meta };
  openEventDetail(id); render();
  try {
    const j = await api('/api/calendar', { method: 'POST', body: { action: 'meta', key: e.metaKey, meta, source: 'checklist' } });
    for (const x of S.events.values()) if (x.metaKey === e.metaKey) x.meta = j.meta;
  } catch (err) {
    for (const x of S.events.values()) if (x.metaKey === e.metaKey) x.meta = before;
    openEventDetail(id); render(); toast(err.message, true);
  }
}

async function saveEventSheet(id, btn) {

  const meta = { priority: Number(segVal('es-pri')) || 2, prep_min: num('es-prep'), travel_min: num('es-travel'), prep_note: val('es-note'), checklist: e.meta?.checklist || [] };
  const m0 = e.meta || {};
  const metaChanged = !e.meta || meta.priority !== m0.priority || meta.prep_min !== (m0.prep_min || 0) || meta.travel_min !== (m0.travel_min || 0) || meta.prep_note !== (m0.prep_note || '');
  const patch = {};
  const title = val('es-title');
  if (title && title !== e.title) patch.title = title;
  if (!e.allDay && $('#es-date')) {
    const s = atTime(val('es-date'), val('es-start'));
    let en = atTime(val('es-date'), val('es-end'));
    if (en <= s) en = addDays(en, 1);
    if (+s !== +e.start || +en !== +e.end) { patch.start = localIso(s); patch.end = localIso(en); }
  }
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    if (metaChanged) {
      const j = await api('/api/calendar', { method: 'POST', body: { action: 'meta', key: e.metaKey, meta } });
      for (const x of S.events.values()) if (x.metaKey === e.metaKey) x.meta = j.meta;

    if (Object.keys(patch).length) {

// ---------- new goal: one question at a time ----------
const WIZ_CATS = ['fitness', 'study', 'money', 'habits', 'work', 'other'];
const TYPE_LABEL = { number: 'A number I count up', streak: 'Something I do repeatedly', milestone: 'A list of steps' };

// Works with no AI at all. The AI only makes the wording better.
function nextLocal(a) {
  if (!a.title) return { field: 'title', question: 'What are you working toward?', hint: 'Name it how you\'d say it out loud', input: 'text' };
  if (!a.category) return { field: 'category', question: 'What part of life is this?', input: 'choice', options: WIZ_CATS };
  if (!a.type) {
    const guess = { money: 'number', fitness: 'streak', habits: 'streak', study: 'streak', work: 'milestone' }[a.category] || 'number';
    return { field: 'type', question: 'How should I track it?', input: 'choice', options: ['number', 'streak', 'milestone'], suggest: guess };
  }
  if (a.type === 'number') {
    if (!a.unit) return { field: 'unit', question: 'What are you counting?', hint: 'A symbol or short word: $, lbs, books', input: 'text', suggest: a.category === 'money' ? '$' : '' };
    if (!a.target) return { field: 'target', question: a.category === 'money' ? 'How much do you want saved?' : `How many ${a.unit} is done?`, input: 'number' };
    if (!a.current) return { field: 'current', question: 'Where are you starting from?', hint: 'Put 0 if you\'re starting fresh', input: 'number', suggest: '0' };
  }
  if (a.type === 'streak' && !a.per_week) return { field: 'per_week', question: 'How many days a week is realistic?', hint: 'Be honest, not ambitious', input: 'number', suggest: '3' };
  if (a.type === 'milestone' && !a.steps) return { field: 'steps', question: 'What are the steps? One per line.', input: 'text' };
  // Optional fields: an empty answer still counts as answered, or Skip loops forever.
  if (!('start_date' in a)) return { field: 'start_date', question: 'When does this start?', hint: 'Leave it blank to start today', input: 'date' };
  if (!('deadline' in a) && a.type !== 'streak') return { field: 'deadline', question: 'When do you want it done?', hint: 'Blank is fine if there\'s no date', input: 'date' };
  return { field: 'done', question: 'Here\'s what I\'ve got.' };
}
async function wizAsk() {
  const a = S.wiz.answers;
  const local = nextLocal(a);
  // Steps 1 and 2 are always the same, so don't spend a round trip on them.
  if (local.field === 'title' || local.field === 'category' || local.field === 'done' || !S.wizAI) {
    S.wiz.q = local; S.wiz.busy = false; return openWizard();
  }
  S.wiz.busy = true; openWizard();
  try {
    const j = await api('/api/ai', { method: 'POST', body: { action: 'goalq', answers: a, today: todayKey() } });
    // The AI picks the wording; the local script stays in charge of what's still missing.
    S.wiz.q = (j.field === local.field) ? { ...local, question: j.question || local.question, hint: j.hint || local.hint, suggest: j.suggest || local.suggest } : local;
  } catch (err) {
    S.wizAI = false; S.wiz.q = local;
  }
  S.wiz.busy = false;
  openWizard();
}
function openWizard(reset) {
  if (reset) { S.wiz = { answers: {}, q: null, busy: false, order: [] }; S.wizAI = true; }
  S.sheetIs = 'wiz';
  if (!S.wiz.q && !S.wiz.busy) return wizAsk();
  const { q, busy, answers } = S.wiz;
  const steps = Object.keys(answers).length;
  if (busy) return openSheet(`<div class="wiz"><div class="wiz-dots">${dots(steps)}</div><h2 class="wiz-q">Thinking…</h2></div>`);

  if (q.field === 'done') {
    const a = answers;
    const lines = [['Goal', a.title], ['Area', GOALCATS[a.category]?.name || a.category], ['Tracked as', TYPE_LABEL[a.type]]];
    if (a.type === 'number') lines.push(['Target', `${fmtNum(a.target, a.unit)}${+a.current ? `, from ${fmtNum(a.current, a.unit)}` : ''}`]);
    if (a.type === 'streak') lines.push(['How often', `${a.per_week}x a week`]);
    if (a.type === 'milestone') lines.push(['Steps', String(a.steps).split('\n').filter(Boolean).length]);
    if (a.start_date) lines.push(['Starts', fmtDay(parseDay(a.start_date))]);
    if (a.deadline) lines.push(['Done by', fmtDay(parseDay(a.deadline))]);
    return openSheet(`<div class="wiz"><div class="wiz-dots">${dots(steps)}</div>
      <h2 class="wiz-q">${esc(a.title)}</h2>
      <div class="det">${lines.map(([k, v]) => `<div class="det-row2"><span>${k}</span><div><b>${esc(String(v))}</b></div></div>`).join('')}</div>
      <button class="btn" data-act="wiz-save">Create this goal</button>
      <button class="btn ghost" data-act="wiz-back">Change something</button></div>`);
  }

  let input;
  if (q.input === 'choice') {
    const opts = q.options || [];
    input = `<div class="wiz-opts">${opts.map((o) => {
      const label = TYPE_LABEL[o] || GOALCATS[o]?.name || o;
      const dot = GOALCATS[o] ? `<i style="background:${GOALCATS[o].c}"></i>` : '';
      return `<button class="wiz-opt${q.suggest === o ? ' sug' : ''}" data-act="wiz-pick" data-v="${esc(o)}">${dot}<span>${esc(label)}</span>${q.suggest === o ? '<em>suggested</em>' : ''}</button>`;
    }).join('')}</div>`;
  } else if (q.field === 'steps') {
    input = `<textarea class="inp wiz-in" id="wiz-val" rows="5" placeholder="One step per line"></textarea><button class="btn" data-act="wiz-next">Next</button>`;
  } else {
    const type = q.input === 'number' ? 'number' : q.input === 'date' ? 'date' : 'text';
    input = `<input class="inp wiz-in" id="wiz-val" type="${type}" ${type === 'number' ? 'inputmode="decimal"' : ''} value="${esc(q.suggest || '')}" enterkeyhint="next">
      <button class="btn" data-act="wiz-next">Next</button>${q.input === 'date' ? '<button class="btn ghost" data-act="wiz-skip">Skip this</button>' : ''}`;
  }
  openSheet(`<div class="wiz"><div class="wiz-dots">${dots(steps)}</div>
    <h2 class="wiz-q">${esc(q.question)}</h2>
    ${q.hint ? `<p class="wiz-hint">${esc(q.hint)}</p>` : ''}
    ${input}
    ${steps ? '<button class="btn ghost" data-act="wiz-back">Back</button>' : ''}</div>`);
  setTimeout(() => { const el = $('#wiz-val'); if (el && q.input !== 'date') { el.focus(); el.select?.(); } }, 260);
}
const dots = (n) => [...Array(7)].map((_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');

function wizAnswer(field, value) {
  S.wiz.answers[field] = value;
  S.wiz.order = (S.wiz.order || []).concat(field);

function wizBack() {
  const order = S.wiz.order || [];
  const last = order.pop();
  if (last) delete S.wiz.answers[last];
  S.wiz.order = order; S.wiz.q = null;
  wizAsk();
}

    el.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el));
    if (el.parentElement.id === 'gf-type') setGoalType(el.dataset.v);
    if (el.parentElement.id === 'gf-mode') setPaceMode(el.dataset.v);
    if (el.parentElement.id === 'av-range') openAvSheet(el.dataset.v);
    if (el.parentElement.id === 'gf-cat' && draft?.newGoal && !goalTouched()) {
      // Picking an area on a blank form sets the sensible default for it.
      const d = { money: ['number', '$'], study: ['streak', ''], fitness: ['streak', ''], habits: ['streak', ''], work: ['milestone', ''], other: ['number', ''] }[el.dataset.v] || ['number', ''];
      const btn = $(`#gf-type [data-v="${d[0]}"]`);
      if (btn) { $('#gf-type').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === btn)); setGoalType(d[0]); }
      $('#gf-unit').value = d[1];
    }
  },
  'tpl-use': (el) => openEventForm(S.data.templates.find((t) => t.id === el.dataset.id)),
  'ev-custom': () => openEventForm(null),
  'ef-allday': (el) => { $('#ef-times').hidden = el.checked; },
  'ef-save': (el) => saveEventForm(el),
  'es-save': (el) => saveEventSheet(el.dataset.id, el),
  'es-delete': (el) => deleteEvent(el.dataset.id, el),
  'rem-check': (el) => toggleRem(el.dataset.id),
  'rem-open': (el) => openRemForm(el.dataset.id),
  'rem-new': () => openRemForm(null),
  'rf-save': (el) => saveRemForm(el.dataset.id, el),
  'rf-done': (el) => { toggleRem(el.dataset.id); closeSheet(); },
  async 'rf-delete'(el) {
    const id = el.dataset.id;
    const r = S.data.reminders.find((x) => x.id === id);
    removeLocal('reminders', id); closeSheet(); render();
    try { await delRow('reminders', id); toast('Deleted'); } catch (err) { upsertLocal('reminders', r); render(); toast(err.message, true); }
  },
  anchor: (el) => openAnchorSheet(el.dataset.day, el.dataset.id),
  'anchor-reset': (el) => { resetAnchor(el.dataset.day, el.dataset.id); closeSheet(); },
  'anchor-save': (el) => { const t = val('an-time'); if (t) { moveAnchor(el.dataset.day, el.dataset.id, t); closeSheet(); } },
  'anchor-hide': async (el) => {
    const k = el.dataset.day, id = el.dataset.id;
    const row = { id: `${k}:${id}`, day: k, anchor_id: id, time: null, hidden: true };
    upsertLocal('day_routines', row); closeSheet(); render();
    try { await saveRow('day_routines', row); } catch (err) { removeLocal('day_routines', row.id); render(); toast(err.message, true); }
  },
  'slot-find': (el) => findSlot(el.dataset.id),
  'slot-accept': (el) => acceptSlot(el),
  'slot-again': () => findSlot(S.slot?.id),
  'uns-new': () => { openRemForm(null); const c = $('#rf-needs'); if (c) c.checked = true; },
  'av-open': () => openAvSheet(),
  'av-share': (el) => shareAvailability(el),
  'weekly-open': openWeeklySheet,
  'weekly-run': (el) => { if (el.closest('#sheet')) S.sheetIs = 'weekly'; ensureCheckin(true); },
  'weekly-hide': () => { localStorage.setItem('launch.checkin.hid', planWeek()); render(); },
  'qa-when': (el) => { S.qaWhen = el.dataset.v; const v = $('#qa')?.value; render(); if (v) $('#qa').value = v; },
  'qa-add': quickAddRem,
  'goal-new': () => openWizard(true),
  'wiz-pick': (el) => wizAnswer(S.wiz.q.field, el.dataset.v),
  'wiz-next': () => {
    const v = val('wiz-val');
    if (!v && S.wiz.q.input !== 'date') return toast('Fill that in first.', true);
    wizAnswer(S.wiz.q.field, v);
  },
  'wiz-skip': () => wizAnswer(S.wiz.q.field, ''),
  'wiz-back': wizBack,
  'wiz-save': (el) => wizSave(el),
  'goal-open': (el) => openGoalSheet(el.dataset.id),
  'goal-edit': (el) => openGoalForm(el.dataset.id),
  'gf-save': (el) => saveGoalForm(el.dataset.id, el),
  'goal-check': (el) => { const g = goalById(el.dataset.id); if (g) toggleCheckin(g, todayKey()); },
  'goal-day': async (el) => { const g = goalById(el.dataset.id); if (g) { await toggleCheckin(g, el.dataset.k); openGoalSheet(g.id); } },
  async 'goal-archive'(el) {
    const g = goalById(el.dataset.id);
    if (!g || !confirm(`Archive "${g.title}"? It disappears from your goals.`)) return;
    g.archived = true; closeSheet(); render();
    try { await saveRow('goals', g); toast('Goal archived'); } catch (err) { g.archived = false; render(); toast(err.message, true); }
  },
  'gs-add': (el) => {
    const g = goalById(el.dataset.id);
    const raw = val('gs-add');
    const delta = raw === '' ? (+g.step || 1) : Number(raw);
    if (!g || !Number.isFinite(delta) || delta === 0) return;
    addToNumber(g, delta).then(() => openGoalSheet(g.id));
  },
  async 'ms-add'(el) {
    const title = val('ms-new');
    if (!title) return;
    const row = { id: uid(), goal_id: el.dataset.id, title, done: false, sort: msOf(el.dataset.id).length + 1 };
    upsertLocal('milestones', row); openGoalSheet(el.dataset.id); render();
    setTimeout(() => $('#ms-new')?.focus(), 50);
    try { await saveRow('milestones', row); } catch (err) { removeLocal('milestones', row.id); openGoalSheet(el.dataset.id); render(); toast(err.message, true); }
  },
  async 'ms-toggle'(el) {
    const m = S.data.milestones.find((x) => x.id === el.dataset.id);
    if (!m) return;
    m.done = !m.done; openGoalSheet(m.goal_id); render();
    try { await saveRow('milestones', m); } catch (err) { m.done = !m.done; openGoalSheet(m.goal_id); render(); toast(err.message, true); }
  },
  async 'ms-del'(el) {
    const m = S.data.milestones.find((x) => x.id === el.dataset.id);
    if (!m) return;
    removeLocal('milestones', m.id); openGoalSheet(m.goal_id); render();
    try { await delRow('milestones', m.id); } catch (err) { upsertLocal('milestones', m); openGoalSheet(m.goal_id); render(); toast(err.message, true); }
  },
  'theme-set': async (el) => {
    applyTheme(el.dataset.v);
    openSettings();
    try { const saved = await saveRow('settings', { id: 'theme', value: { preset: el.dataset.v } }); upsertLocal('settings', saved); }
    catch (err) { toast(err.message, true); }
  },
  'rt-add': () => { const list = $('#rt-list'); list.insertAdjacentHTML('beforeend', anchorRow({ label: '', time: '', days: 'all' }, list.children.length)); },
  'rt-del': (el) => { el.closest('.rt2').remove(); },
  'rt-save': (el) => saveRoutines(el),
  'tpl-edit': (el) => openTplForm(el.dataset.id || null),
  'tf-save': (el) => saveTplForm(el.dataset.id, el),
  async 'tf-delete'(el) {
    const t = S.data.templates.find((x) => x.id === el.dataset.id);
    if (!t || !confirm(`Delete the "${t.name}" template?`)) return;
    try { await delRow('templates', t.id); removeLocal('templates', t.id); openSettings(); toast('Template deleted'); } catch (err) { toast(err.message, true); }
  },
  async 'profile-save'(el) {
    const text = $('#st-profile').value.trim();
    el.disabled = true;
    try { const saved = await saveRow('settings', { id: 'profile', value: { text } }); upsertLocal('settings', saved); toast('Saved'); } catch (err) { toast(err.message, true); }
    el.disabled = false;
  },
};

function signOut() {
  localStorage.removeItem('launch.token');
  S.token = ''; S.data = null; S.events.clear(); S.briefing = null; S.eventsReady = false; S.triaged.clear();
  render();
}

// ---------- pull the week strip down into a month ----------
const MON = { y0: 0, dy: 0, live: false };
function monthDown(ev) {
  if (ev.target.closest('button') && !S.month) return; // let day taps through
  MON.y0 = ev.clientY; MON.dy = 0; MON.live = true;
}
function monthMove(ev) {
  if (!MON.live) return;
  MON.dy = ev.clientY - MON.y0;
  if (Math.abs(MON.dy) > 14) {
    const strip = $('.week');
    if (strip) strip.style.setProperty('--pull', Math.max(0, Math.min(1, Math.abs(MON.dy) / 90)));
  }
}
function monthUp(cancel) {
  if (!MON.live) return;
  MON.live = false;
  const strip = $('.week');
  if (strip) strip.style.removeProperty('--pull');
  if (cancel) return;
  if (!S.month && MON.dy > 45) { S.month = true; ensureMonth(); render(); }
  else if (S.month && MON.dy < -45) { S.month = false; render(); }
}
function monthHTML(anchor) {
  const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const start = sow(first);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i), k = dayKey(d);
    if (i >= 35 && d.getMonth() !== anchor.getMonth()) break;
    const evs = eventsOn(k);
    const colors = [...new Set(evs.sort((a, b) => pri(b) - pri(a)).map((e) => catOf(e.colorId).c))].slice(0, 3);
    cells.push(`<button class="md${d.getMonth() === anchor.getMonth() ? '' : ' off'}${k === S.selDay ? ' on' : ''}${k === todayKey() ? ' today' : ''}" data-act="day-sel" data-k="${k}">
      <b>${d.getDate()}</b><i>${colors.map((c) => `<em style="--c:${c}"></em>`).join('')}</i></button>`);
  }
  return `<div class="month glass">
    <div class="mhead">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((x) => `<span>${x}</span>`).join('')}</div>
    <div class="mgrid">${cells.join('')}</div>
    <button class="mclose" data-act="month-close">Back to the week</button></div>`;
}

// ---------- pull a sheet down to dismiss ----------
const SH = { y0: 0, dy: 0, live: false, fromTop: false };
function sheetDown(ev) {
  const sh = $('#sheet');
  if (!sh.classList.contains('show')) return;
  const onGrab = !!ev.target.closest('.grab') || !!ev.target.closest('.sheet-h');
  if (!onGrab && sh.scrollTop > 2) return;
  if (ev.target.closest('input, textarea, select')) return;
  SH.y0 = ev.clientY; SH.dy = 0; SH.live = true; SH.fromTop = true;
  sh.style.transition = 'none';
}
function sheetMove(ev) {
  if (!SH.live) return;
  const sh = $('#sheet');
  SH.dy = ev.clientY - SH.y0;
  if (SH.dy < 0) { SH.dy = SH.dy / 4; }
  if (SH.dy > 3 && sh.scrollTop > 2) { sheetUp(true); return; }
  sh.style.transform = window.innerWidth >= 760 ? `translate(-50%,calc(-50% + ${SH.dy}px))` : `translateY(${Math.max(0, SH.dy)}px)`;
  $('#scrim').style.opacity = String(Math.max(0, 1 - SH.dy / 420));
}
function sheetUp(cancel) {
  if (!SH.live) return;
  SH.live = false;
  const sh = $('#sheet');
  sh.style.transition = '';
  sh.style.transform = '';
  $('#scrim').style.opacity = '';
  if (!cancel && SH.dy > 110) closeSheet();
}

// ---------- drag to move: long-press, slide, release ----------
const DRAG = { el: null, timer: null, startY: 0, y0: 0, baseMin: 0, mins: 0, live: false, moved: false, endedAt: 0, kind: null, id: null, k: null };
const PX_PER_5 = 7; // finger travel for a 5 minute nudge

function dragChip(text) {
  let c = $('#drag-chip');
  if (!c) {
    c = document.createElement('div'); c.id = 'drag-chip'; c.className = 'drag-chip';
    const h = document.createElement('div'); h.id = 'drag-hint'; h.className = 'drag-hint'; h.textContent = 'Slide to move, let go to save';
    document.body.append(c, h);
  }
  c.textContent = text;
}
function chipTo(y) { const c = $('#drag-chip'); if (c) c.style.top = y + 'px'; }
function endChip() { $('#drag-chip')?.remove(); $('#drag-hint')?.remove(); }

function dragCancel() {
  clearTimeout(DRAG.timer);
  DRAG.el?.classList.remove('dragging', 'press');
  endChip();
  DRAG.el = null; DRAG.live = false;
}
function dragStart(el, y) {
  DRAG.el = el; DRAG.startY = y; DRAG.y0 = y; DRAG.moved = false; DRAG.live = false;
  DRAG.kind = el.dataset.drag; DRAG.id = el.dataset.id2; DRAG.k = el.dataset.k || S.selDay;
  DRAG.baseMin = +el.dataset.min || 0; DRAG.mins = DRAG.baseMin;
  el.classList.add('press');
  DRAG.timer = setTimeout(() => {
    DRAG.live = true;
    el.classList.remove('press');
    el.classList.add('dragging');
    dragChip(fmtT(minToDate(DRAG.k, DRAG.baseMin)));
    chipTo(y);
  }, 320);
}
const minToDate = (k, m) => atTime(k, `${pad(Math.floor(((m % 1440) + 1440) % 1440 / 60))}:${pad(((m % 60) + 60) % 60)}`);
function dragMove(y) {
  if (!DRAG.el) return;
  if (!DRAG.live) { if (Math.abs(y - DRAG.startY) > 9) dragCancel(); return; }
  DRAG.moved = true;
  const step = Math.round((y - DRAG.y0) / PX_PER_5) * 5;
  DRAG.mins = Math.max(0, Math.min(1435, DRAG.baseMin + step));
  dragChip(fmtT(minToDate(DRAG.k, DRAG.mins)));
  chipTo(y);
}
async function dragEnd() {
  if (!DRAG.el || !DRAG.live) return dragCancel();
  const { kind, id, k, mins, baseMin } = DRAG;
  if (DRAG.moved) DRAG.endedAt = Date.now();
  dragCancel();
  if (mins === baseMin) return;
  const time = `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`;
  if (kind === 'anchor') { await moveAnchor(k, id, time); return toast(`Moved to ${fmtT(minToDate(k, mins))}`); }
  const e = S.events.get(id);
  if (!e) return;
  const shift = (mins - baseMin) * 6e4;
  const ns = new Date(+e.start + shift), ne = new Date(+e.end + shift);
  const before = { start: e.start, end: e.end };
  e.start = ns; e.end = ne; render();
  try {
    const j = await api('/api/calendar', { method: 'POST', body: { action: 'update', id, patch: { start: localIso(ns), end: localIso(ne), allDay: false } } });
    S.events.set(id, normEv(j.event));
    S.briefing = null; render(); ensureBriefing();
    toast(`Moved to ${fmtT(ns)}`);
  } catch (err) { Object.assign(e, before); render(); toast(err.message, true); }
}

document.addEventListener('pointerdown', (ev) => {
  if (ev.button > 0) return;
  if (ev.target.closest('#sheet')) { sheetDown(ev); return; }
  const strip = ev.target.closest('.week');
  if (strip) { monthDown(ev); return; }
  const el = ev.target.closest('[data-drag]');
  if (!el || ev.target.closest('button')) return;
  dragStart(el, ev.clientY);
}, { passive: true });
document.addEventListener('pointermove', (ev) => { sheetMove(ev); monthMove(ev); dragMove(ev.clientY); }, { passive: true });
document.addEventListener('pointerup', () => { sheetUp(); monthUp(); dragEnd(); });
document.addEventListener('pointercancel', () => { sheetUp(true); monthUp(true); dragCancel(); });
document.addEventListener('scroll', () => { if (!DRAG.live) dragCancel(); }, true);
// iOS scrolls the page unless we say otherwise mid-drag
document.addEventListener('touchmove', (ev) => { if (DRAG.live || (SH.live && SH.dy > 0) || MON.live) ev.preventDefault(); }, { passive: false });

document.addEventListener('click', (ev) => {
  // Swallow only the ghost click that follows a drag, never a real tap later on.
  if (DRAG.endedAt && Date.now() - DRAG.endedAt < 400) { DRAG.endedAt = 0; ev.preventDefault(); ev.stopPropagation(); return; }
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { A[el.dataset.act]?.(el, ev); return; }
  ev.preventDefault();
  A[el.dataset.act]?.(el, ev);
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') return closeSheet();
  if (ev.key !== 'Enter') return;
  if (ev.target.id === 'qa') { ev.preventDefault(); return quickAddRem(); }
  if (ev.target.id === 'pass') { ev.preventDefault(); return A.login($('[data-act="login"]')); }
  if (ev.target.id === 'ms-new') { ev.preventDefault(); return A['ms-add']($('[data-act="ms-add"]')); }
  if (ev.target.id === 'ck-new') { ev.preventDefault(); return A['ck-add']($('[data-act="ck-add"]')); }
  if (ev.target.id === 'wiz-val' && ev.target.tagName !== 'TEXTAREA') { ev.preventDefault(); return A['wiz-next'](); }
  if (ev.target.getAttribute('role') === 'button') { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'ef-start' && draft) { // keep the length when the start moves
    const len = draft.tpl?.duration_min || 60;
    const s = atTime(val('ef-date') || todayKey(), ev.target.value || '00:00');
    $('#ef-end').value = hhmm(new Date(s.getTime() + len * 6e4));
  }
});
window.addEventListener('resize', moveTabPill);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.token) { setSky(); if (Date.now() - S.lastLoad > 5 * 60e3) refreshAll(); else render(); }
});
setInterval(() => { if (S.token && !document.hidden && !$('#sheet').classList.contains('show') && S.view !== 'reminders') render(); }, 60e3);

function handleQuery() {
  const p = new URLSearchParams(location.search);
  if (p.get('google') === 'connected') setTimeout(() => toast('Google Calendar connected'), 300);
  if (p.get('google') === 'error') setTimeout(() => toast(p.get('msg') || 'Google sign-in failed.', true), 300);
  if (p.has('google')) history.replaceState(null, '', '/');
}

applyTheme(S.theme);
handleQuery();
render();
if (S.token) refreshAll();
</script>
