<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Launch">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0d1424; --night-2:#141d31;
  --ink:#eef2f8; --ink-2:#aab3c5; --ink-3:#6f7a91;
  --line:rgba(255,255,255,.09); --glass:rgba(255,255,255,.055);
  --dawn:#f2c46d; --dawn-ink:#1d1606; --danger:#ff6b61; --ok:#3ecf8e;
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  --sky:rgba(242,170,90,.24); --sky2:rgba(120,110,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--night);color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased;line-height:1.4}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(130% 55% at 50% -12%,var(--sky) 0%,transparent 62%),radial-gradient(70% 45% at 105% 0%,var(--sky2),transparent 70%);transition:background 1.2s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--dawn);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}

.glass{background:var(--glass);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 32px rgba(3,6,15,.32);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}

.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 120px)}
@media(min-width:1000px){.app{max-width:1120px;padding-left:32px;padding-right:32px}}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 20px}
.dayname{font-family:var(--serif);font-weight:400;font-size:46px;line-height:.95;letter-spacing:-.01em}
.daydate{color:var(--ink-2);font-size:15px;margin-top:6px}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink-2)}
.icon-btn svg{width:20px;height:20px}
.hdr-actions{display:flex;gap:8px}

.today-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media(min-width:1000px){.today-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:36px}}

/* briefing */
.brief{border-radius:26px;padding:22px 20px 16px}
.brief h2{font-family:var(--serif);font-weight:400;font-size:31px;line-height:1.08;margin-bottom:10px;text-wrap:balance}
.brief p{color:var(--ink-2);font-size:16px;line-height:1.5;max-width:62ch}
.brief .btn{margin-top:16px}
.brief.reveal{animation:rise .7s cubic-bezier(.2,.9,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.brief.thinking h2{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.focus{list-style:none;margin-top:14px;display:grid;gap:8px}
.focus li{display:flex;gap:10px;align-items:baseline;font-size:15px}
.focus li::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--dawn);flex:none;transform:translateY(-1px)}
.brief-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13px}
.brief-foot .stale{color:var(--dawn)}
.link-btn{color:var(--dawn);font-weight:600;font-size:14px;padding:6px 0;white-space:nowrap}

/* next up */
.next{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px 14px 14px;border-radius:18px;margin-top:14px;width:100%}
.next .rail{align-self:stretch;border-radius:3px;background:var(--c)}
.next .when{font-size:13px;color:var(--ink-2)}
.next .ttl{font-size:17px;font-weight:650;margin:2px 0}
.next .lead-l{font-size:13px;color:var(--dawn)}
.next .count{font-family:var(--serif);font-size:26px;line-height:1;text-align:right;color:var(--ink)}
.next .count small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-top:4px}

/* sections */
.sec{margin-top:28px}
.sec h3{font-size:18px;font-weight:650;margin-bottom:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h3{margin-bottom:6px}
.muted{color:var(--ink-3);font-size:14px}
.note-err{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(255,107,97,.1);color:#ffb3ad;font-size:14px}

/* lineup: the day rail */
.allday{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px 70px}
.chip{padding:6px 12px;border-radius:999px;font-size:13px;background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.row{display:grid;grid-template-columns:58px 5px minmax(0,1fr);column-gap:12px;width:100%;cursor:pointer}
.row .t{font-size:13px;color:var(--ink-2);padding-top:11px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.25}
.row .t small{display:block;color:var(--ink-3);font-size:11px}
.row .rail{border-radius:3px;background:var(--c);margin:3px 0}
.row .body{padding:9px 0 13px;min-width:0}
.row .title{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.row.p3 .body{padding:13px 14px;margin:3px 0;border-radius:16px;background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.row.p3 .title{font-size:19px;font-weight:700}
.row.p1 .title{font-size:15px;font-weight:500;color:var(--ink-2)}
.row.p1 .rail{opacity:.5}
.row.p1 .body{padding-bottom:9px}
.row.past{opacity:.42}
.row.live .sub{color:var(--dawn)}
.row.lead{cursor:default}
.row.lead .t{padding-top:5px;color:var(--ink-3)}
.row.lead .rail{background:repeating-linear-gradient(-45deg,var(--c) 0 3px,transparent 3px 7px);opacity:.85;margin:3px 0 0}
.row.lead .body{padding:4px 0 6px;font-size:13px;color:var(--ink-2);line-height:1.5}
.row.lead b{color:var(--ink);font-weight:600}
.log-btn{margin-top:8px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.logged{margin-top:6px;font-size:12px;color:var(--ok)}
.now{display:grid;grid-template-columns:58px minmax(0,1fr);column-gap:12px;align-items:center;margin:4px 0}
.now .t{color:var(--dawn);font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.now .line{height:2px;background:var(--dawn);border-radius:2px;position:relative;margin-left:-5px}
.now .line::before{content:'';position:absolute;left:0;top:50%;width:11px;height:11px;border-radius:50%;background:var(--dawn);transform:translate(-3px,-50%);box-shadow:0 0 0 5px rgba(242,196,109,.18)}
.empty-day{color:var(--ink-3);font-size:15px;padding:8px 0 0 70px}

/* coming up */
.heads{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;cursor:pointer;width:100%}
.heads .dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:5px}
.heads b{display:block;font-size:15px;font-weight:600}
.heads small{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:6px;border-radius:20px}
.wd{display:grid;justify-items:center;gap:3px;padding:8px 0 9px;border-radius:14px;color:var(--ink-2)}
.wd span{font-size:11px}
.wd b{font-size:18px;font-weight:600;color:var(--ink)}
.wd i{display:flex;gap:3px;height:6px}
.wd i em{width:5px;height:5px;border-radius:50%;background:var(--c)}
.wd.today b{color:var(--dawn)}
.wd.on{background:rgba(255,255,255,.12)}

/* goals */
.goal{padding:16px 16px 14px;border-radius:20px;margin-bottom:12px;cursor:pointer;display:block;width:100%}
.goal .gt{display:flex;align-items:center;gap:10px}
.goal .gt i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.goal h4{font-size:17px;font-weight:650;flex:1;min-width:0;overflow-wrap:anywhere}
.gnum{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.gnum .big{font-family:var(--serif);font-size:38px;line-height:1}
.gnum .of{color:var(--ink-2);font-size:14px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .5s cubic-bezier(.2,.9,.2,1)}
.dots{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.dots span{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:11px;color:var(--ink-3)}
.dots span.hit{background:var(--c);color:#08101f;font-weight:700}
.dots span.today{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.dots button span{pointer-events:none}
.gfoot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--ink-3)}
.pace.behind{color:var(--dawn)}
.pace.done{color:var(--ok)}
.chk-btn{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:650;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);flex:none}
.chk-btn.on{background:var(--c);color:#08101f}
.mini{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.mini>div{flex:1;min-width:0}
.mini b{display:block;font-size:15px;font-weight:600}
.mini small{color:var(--dawn);font-size:13px}
.empty-card{padding:22px 20px;border-radius:20px;text-align:left}
.empty-card p{color:var(--ink-2);margin-bottom:14px}

/* reminders */
.qadd{display:flex;gap:6px;padding:6px 6px 6px 12px;border-radius:16px;align-items:center}
.qadd input{flex:1;min-width:0;background:transparent;border:0;padding:10px 2px;font-size:16px;outline:none}
.qadd input::placeholder{color:var(--ink-3)}
.qa-go{padding:10px 16px;border-radius:12px;background:var(--dawn);color:var(--dawn-ink);font-weight:700}
.qa-when{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.pill{padding:7px 13px;border-radius:999px;font-size:13px;border:1px solid var(--line);color:var(--ink-2)}
.pill.on{background:rgba(242,196,109,.16);border-color:rgba(242,196,109,.55);color:var(--ink)}
.rem{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:0}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;margin-top:1px}
.check svg{width:14px;height:14px}
.check.on{background:var(--ok);border-color:var(--ok);color:#06140d}
.rem-b{cursor:pointer;min-width:0}
.rem-t{font-size:16px;overflow-wrap:anywhere}
.rem.done .rem-t{color:var(--ink-3);text-decoration:line-through}
.flag{color:var(--dawn);font-weight:800}
.due{font-size:13px;color:var(--ink-3);margin-top:2px}
.due.late{color:var(--danger)}
.grp{margin-top:22px}
.grp h3{font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:2px}

/* tab bar */
.tabs{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;border-radius:999px;z-index:20;background:rgba(22,31,52,.72)}
.tab{width:64px;height:52px;border-radius:999px;display:grid;place-items:center;align-content:center;gap:2px;color:var(--ink-3);font-size:10px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink);background:rgba(255,255,255,.1)}
.tab.add{width:52px;height:52px;background:var(--dawn);color:var(--dawn-ink);margin:0 6px}
.tab.add svg{width:24px;height:24px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(4,8,18,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90dvh;overflow:auto;overscroll-behavior:contain;border-radius:28px 28px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 26px);z-index:41;
  transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.2,1.02);background:rgba(21,30,51,.9);
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border-top:1px solid var(--line)}
.sheet.show{transform:none}
@media(min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;max-height:86dvh;border-radius:28px;border:1px solid var(--line);opacity:0;transform:translate(-50%,-46%) scale(.98);transition:transform .35s cubic-bezier(.2,.9,.2,1),opacity .2s;pointer-events:none}
  .sheet.show{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.sheet h2{font-size:23px;font-weight:700;margin-bottom:4px;overflow-wrap:anywhere}
.sheet .lede{color:var(--ink-2);font-size:14px;margin-bottom:18px}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheet-h h2{flex:1;margin:0}
.set{padding:16px 0;border-bottom:1px solid var(--line)}
.set h3{font-size:16px;font-weight:650;margin-bottom:6px}
.set .muted{margin-bottom:12px}
.set-row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.set-row span{flex:1;min-width:0}
.set-row small{color:var(--ink-3)}

.field{display:grid;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;color:var(--ink-2)}
.inp{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;-webkit-appearance:none;appearance:none;min-height:46px}
.inp:focus{outline:none;border-color:rgba(242,196,109,.6)}
textarea.inp{resize:vertical;line-height:1.45}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:rgba(255,255,255,.06);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:9px 4px;border-radius:9px;font-size:14px;color:var(--ink-2);text-align:center}
.seg button.on{background:rgba(255,255,255,.15);color:var(--ink);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px}
.sw i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sw.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px;font-size:15px}
.switch input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .2s}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.2,.9,.2,1.2)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
details.more{margin:4px 0 14px;border:1px solid var(--line);border-radius:14px;padding:0 14px}
details.more summary{padding:13px 0;font-size:15px;color:var(--ink-2);cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:4px}
.ai-tag{font-size:12px;color:var(--ink-3);margin-left:6px;font-weight:400}

.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--dawn);color:var(--dawn-ink);font-weight:700;font-size:16px;text-align:center}
.btn.ghost{background:rgba(255,255,255,.09);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);font-weight:600}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn+.btn{margin-top:10px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.tpl{padding:13px 14px;border-radius:16px;background:color-mix(in srgb,var(--c) 11%,rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--c) 32%,transparent);min-width:0}
.tpl b{display:block;font-size:15px;font-weight:650;overflow-wrap:anywhere}
.tpl small{color:var(--ink-3);font-size:12px}
.ms{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ms .x{color:var(--ink-3);font-size:20px;line-height:1;padding:4px 8px}
.logs{margin-top:10px}
.logs div{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--line)}

/* login */
.login{min-height:calc(100dvh - 140px);display:grid;align-content:center;gap:14px;max-width:360px;margin:0 auto}
.login h1{font-family:var(--serif);font-weight:400;font-size:64px;line-height:.9}
.login p{color:var(--ink-2);margin-bottom:8px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translate(-50%,16px);opacity:0;padding:11px 16px;border-radius:14px;background:rgba(30,40,64,.95);border:1px solid var(--line);font-size:14px;z-index:60;transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.2,1);max-width:calc(100vw - 40px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(255,107,97,.5)}
.loading{color:var(--ink-3);padding:18px 0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" id="view"></main>
<nav class="tabs glass" id="tabs" hidden aria-label="Main">
  <button class="tab" data-act="tab" data-v="today" aria-label="Today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17h18M6.5 17a5.5 5.5 0 0 1 11 0M12 5v2.5M5.2 8.2l1.7 1.7M18.8 8.2l-1.7 1.7"/></svg>Today</button>
  <button class="tab" data-act="tab" data-v="schedule" aria-label="Schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Schedule</button>
  <button class="tab add" data-act="add" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<script>
/* ============================================================
   Launch v1 — schedule by priority + prep, goals, reminders,
   and an AI morning game plan. Google Calendar is the data layer.
   ============================================================ */

// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16); }));
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sod = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const sow = (d) => addDays(sod(d), -((d.getDay() + 6) % 7)); // Monday
const todayKey = () => dayKey(new Date());
const hhmm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const localIso = (d) => `${dayKey(d)}T${hhmm(d)}`;
const atTime = (k, t) => { const d = parseDay(k); const [h, m] = t.split(':').map(Number); d.setHours(h, m, 0, 0); return d; };
const fmtT = (d) => { let h = d.getHours(); const m = d.getMinutes(); const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12; return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`; };
const fmtDur = (min) => { min = Math.max(0, Math.round(min)); if (min < 60) return `${min}m`; const h = Math.floor(min / 60), m = min % 60; return m ? `${h}h ${m}m` : `${h}h`; };
const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MO = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fmtDay = (d) => `${WD[d.getDay()].slice(0, 3)}, ${MO[d.getMonth()].slice(0, 3)} ${d.getDate()}`;
const relDay = (k) => {
  const n = new Date();
  if (k === dayKey(n)) return 'Today';
  if (k === dayKey(addDays(n, 1))) return 'Tomorrow';
  if (k === dayKey(addDays(n, -1))) return 'Yesterday';
  const d = parseDay(k);
  return (d - sod(n)) / 864e5 < 7 && d > n ? WD[d.getDay()] : fmtDay(d);
};
const fmtNum = (v, unit) => {
  const n = Number(v) || 0;
  const s = n.toLocaleString(undefined, { maximumFractionDigits: 2 });
  if (!unit) return s;
  return unit === '$' ? `$${s}` : `${s} ${unit}`;
};
const ICON = {
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
};

// Google's event colors, brightened for a dark UI. Your scheme:
// INC red, Home Depot orange, fitness green, personal light blue,
// family/social purple, travel/buffer gray, builds lavender.
const CATS = {
  '11': { name: 'INC', c: '#ff5a4f' },
  '6': { name: 'Home Depot', c: '#ff8a3d' },
  '2': { name: 'Fitness', c: '#3ecf8e' },
  '7': { name: 'Personal', c: '#38b6ff' },
  '3': { name: 'Family & social', c: '#b56cf0' },
  '8': { name: 'Travel & buffer', c: '#8b93a3' },
  '1': { name: 'Builds', c: '#8e9cff' },
  '4': { name: 'Flamingo', c: '#f08a80' },
  '5': { name: 'Banana', c: '#f6c945' },
  '9': { name: 'Blueberry', c: '#5b6cf0' },
  '10': { name: 'Basil', c: '#1fa463' },
};
const PICK = ['11', '6', '2', '7', '3', '1', '8'];
const catOf = (id) => CATS[id] || { name: 'No color', c: '#7d8aa8' };
const GOALCATS = {
  fitness: { name: 'Fitness', c: '#3ecf8e' },
  study: { name: 'Study', c: '#38b6ff' },
  money: { name: 'Money', c: '#f6c945' },
  habits: { name: 'Habits', c: '#b56cf0' },
  work: { name: 'Work', c: '#ff5a4f' },
  other: { name: 'Other', c: '#8b93a3' },
};
const goalCat = (g) => GOALCATS[g.category] || GOALCATS.other;

// ---------- state ----------
const S = {
  token: localStorage.getItem('launch.token') || '',
  view: 'today',
  data: null,
  google: false,
  events: new Map(),
  eventsReady: false,
  triaged: new Set(),
  triaging: false,
  briefing: null,
  briefingBusy: false,
  briefRevealed: false,
  weekStart: sow(new Date()),
  selDay: todayKey(),
  loadedWeeks: new Set(),
  lastLoad: 0,
  qaWhen: '',
  errors: {},
};

// ---------- api ----------
async function api(path, { method = 'GET', body } = {}) {
  const r = await fetch(path, {
    method,
    headers: { Authorization: `Bearer ${S.token}`, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let j = {};
  try { j = await r.json(); } catch {}
  if (r.status === 401) { signOut(); throw new Error(j.error || 'Signed out.'); }
  if (!r.ok) { const e = new Error(j.error || `Request failed (${r.status})`); e.code = j.code; throw e; }
  return j;
}
const saveRow = async (table, row) => (await api('/api/data', { method: 'POST', body: { action: 'upsert', table, row } })).row;
const delRow = (table, id) => api('/api/data', { method: 'POST', body: { action: 'delete', table, id } });

function upsertLocal(table, row) {
  const list = S.data[table];
  const i = list.findIndex((x) => x.id === row.id);
  if (i >= 0) list[i] = { ...list[i], ...row }; else list.push(row);
}
function removeLocal(table, id) { S.data[table] = S.data[table].filter((x) => x.id !== id); }

let toastTimer;
function toast(msg, err = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', err);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), err ? 4200 : 2200);
}

// ---------- sky follows the hour ----------
function setSky() {
  const h = new Date().getHours();
  const [a, b] = h < 5 ? ['rgba(90,80,210,.20)', 'rgba(60,90,200,.10)']
    : h < 10 ? ['rgba(242,170,90,.26)', 'rgba(255,120,150,.12)']
    : h < 16 ? ['rgba(90,165,255,.20)', 'rgba(120,200,255,.10)']
    : h < 19 ? ['rgba(255,125,90,.22)', 'rgba(190,90,220,.12)']
    : ['rgba(140,95,230,.20)', 'rgba(70,90,210,.10)'];
  document.documentElement.style.setProperty('--sky', a);
  document.documentElement.style.setProperty('--sky2', b);
}

// ---------- events ----------
function normEv(e) {
  return { ...e, start: e.allDay ? parseDay(e.start) : new Date(e.start), end: e.allDay ? parseDay(e.end) : new Date(e.end) };
}
async function loadRange(d0, d1) {
  const j = await api(`/api/calendar?from=${encodeURIComponent(d0.toISOString())}&to=${encodeURIComponent(d1.toISOString())}`);
  const ids = new Set(j.events.map((e) => e.id));
  for (const [id, e] of S.events) if (e.start < d1 && e.end > d0 && !ids.has(id)) S.events.delete(id);
  for (const e of j.events) S.events.set(e.id, normEv(e));
}
function eventsOn(k) {
  const d0 = parseDay(k), d1 = addDays(d0, 1);
  return [...S.events.values()].filter((e) => e.start < d1 && e.end > d0).sort((a, b) => (b.allDay - a.allDay) || (a.start - b.start));
}
const pri = (e) => e.meta?.priority ?? 2;
function leadOf(e) {
  if (e.allDay || !e.meta) return null;
  const prep = e.meta.prep_min || 0, travel = e.meta.travel_min || 0;
  if (prep + travel === 0) return null;
  if (prep + travel < 15 && pri(e) < 3) return null;
  const leave = new Date(e.start - travel * 6e4);
  const ready = new Date(leave - prep * 6e4);
  return { prep, travel, ready, leave };
}
function headsUp() {
  const out = [];
  for (let i = 1; i <= 3; i++) {
    const k = dayKey(addDays(new Date(), i));
    for (const e of eventsOn(k)) {
      if (dayKey(e.start) !== k && !e.allDay) continue;
      if (pri(e) === 3 || (e.meta?.prep_min || 0) >= 45) out.push({ e, k });
    }
  }
  return out.slice(0, 5);
}
function freeGaps(k) {
  const d0 = parseDay(k);
  const w0 = new Date(d0); w0.setHours(7, 0, 0, 0);
  const w1 = new Date(d0); w1.setHours(22, 0, 0, 0);
  const blocks = eventsOn(k).filter((e) => !e.allDay).map((e) => { const l = leadOf(e); return [+(l ? l.ready : e.start), +e.end]; }).sort((a, b) => a[0] - b[0]);
  const gaps = [];
  let cur = +w0;
  for (const [s, e] of blocks) {
    if (s - cur >= 30 * 6e4) gaps.push({ s: new Date(cur), e: new Date(Math.min(s, +w1)) });
    cur = Math.max(cur, e);
  }
  if (+w1 - cur >= 30 * 6e4) gaps.push({ s: new Date(cur), e: w1 });
  return gaps.filter((g) => g.e - g.s >= 30 * 6e4);
}

// ---------- goals ----------
const activeGoals = () => (S.data?.goals || []).filter((g) => !g.archived);
const goalById = (id) => (S.data?.goals || []).find((g) => g.id === id);
const logsOf = (id) => (S.data?.logs || []).filter((l) => l.goal_id === id);
const msOf = (id) => (S.data?.milestones || []).filter((m) => m.goal_id === id).sort((a, b) => (a.sort ?? 0) - (b.sort ?? 0));
function paceFrac(g) {
  if (!g.deadline) return null;
  const c0 = new Date(g.created_at || Date.now()), dl = addDays(parseDay(g.deadline), 1);
  return Math.max(0, Math.min(1, (Date.now() - c0) / Math.max(1, dl - c0)));
}
function goalStatus(g) {
  const logs = logsOf(g.id);
  if (g.type === 'number') {
    const s = +g.start_value || 0, t = +g.target || 0, c = +g.current || 0;
    const pct = t === s ? 0 : Math.max(0, Math.min(1, (c - s) / (t - s)));
    const f = paceFrac(g);
    const behind = pct < 1 && f != null && pct < f - 0.08;
    const pace = pct >= 1 ? 'Done' : f == null ? '' : behind ? 'Behind pace' : 'On pace';
    return { pct, behind, pace, text: `${fmtNum(c, g.unit)} of ${fmtNum(t, g.unit)}` };
  }
  if (g.type === 'milestone') {
    const ms = msOf(g.id), done = ms.filter((m) => m.done).length;
    const pct = ms.length ? done / ms.length : 0;
    const f = paceFrac(g);
    const behind = ms.length > 0 && pct < 1 && f != null && pct < f - 0.08;
    const next = ms.find((m) => !m.done);
    return { pct, behind, pace: pct >= 1 && ms.length ? 'Done' : behind ? 'Behind pace' : next ? `Next: ${next.title}` : 'Add steps to track', text: `${done} of ${ms.length} done` };
  }
  // streak
  const days = new Set(logs.map((l) => l.day));
  const t = todayKey();
  if (g.frequency === 'weekly') {
    const ws = sow(new Date());
    let n = 0;
    for (let i = 0; i < 7; i++) if (days.has(dayKey(addDays(ws, i)))) n++;
    const need = Math.max(1, +g.per_week || 3);
    const left = 7 - ((new Date().getDay() + 6) % 7); // days left incl. today
    const behind = n < need && need - n >= left;
    let weeks = n >= need ? 1 : 0;
    for (let w = 1; w < 60; w++) {
      const s = addDays(ws, -7 * w);
      let c = 0;
      for (let i = 0; i < 7; i++) if (days.has(dayKey(addDays(s, i)))) c++;
      if (c >= need) weeks++; else break;
    }
    return { pct: Math.min(1, n / need), behind, n, need, weeks, pace: n >= need ? 'Week done' : behind ? `Need ${need - n} more, ${left} day${left === 1 ? '' : 's'} left` : `${need - n} to go this week`, text: `${n} of ${need} this week` };
  }
  let d = new Date();
  if (!days.has(dayKey(d))) d = addDays(d, -1);
  let n = 0;
  while (days.has(dayKey(d))) { n++; d = addDays(d, -1); }
  const doneToday = days.has(t);
  return { pct: doneToday ? 1 : 0, behind: !doneToday, n, pace: doneToday ? 'Done today' : 'Not yet today', text: n === 1 ? '1 day' : `${n} days` };
}
async function toggleCheckin(g, day, note = '') {
  const existing = logsOf(g.id).find((l) => l.day === day);
  if (existing) {
    removeLocal('logs', existing.id); render();
    try { await delRow('logs', existing.id); } catch (e) { upsertLocal('logs', existing); render(); toast(e.message, true); }
  } else {
    const row = { id: uid(), goal_id: g.id, day, value: 1, note };
    upsertLocal('logs', row); render();
    try { await saveRow('logs', row); } catch (e) { removeLocal('logs', row.id); render(); toast(e.message, true); }
  }
}
async function addToNumber(g, delta, note = '') {
  const before = g.current;
  g.current = (+g.current || 0) + delta;
  const log = { id: uid(), goal_id: g.id, day: todayKey(), value: delta, note };
  upsertLocal('logs', log); render();
  try { await saveRow('goals', g); await saveRow('logs', log); }
  catch (e) { g.current = before; removeLocal('logs', log.id); render(); toast(e.message, true); }
}
function eventLogged(e, g) {
  const logs = logsOf(g.id);
  if (logs.some((l) => l.note === `event:${e.id}`)) return true;
  return g.type === 'streak' && logs.some((l) => l.day === dayKey(e.start));
}
async function logFromEvent(e) {
  const g = goalById(e.goalId);
  if (!g || eventLogged(e, g)) return;
  if (g.type === 'number') await addToNumber(g, +g.step || 1, `event:${e.id}`);
  else if (g.type === 'streak') await toggleCheckin(g, dayKey(e.start), `event:${e.id}`);
  toast(`Logged to ${g.title}`);
}

// ---------- reminders ----------
const openRems = () => (S.data?.reminders || []).filter((r) => !r.done);
function isLate(r) {
  if (!r.due_date || r.done) return false;
  const t = todayKey();
  if (r.due_date < t) return true;
  return r.due_date === t && r.due_time && atTime(t, r.due_time) < new Date();
}
const dueText = (r) => (r.due_date ? relDay(r.due_date) + (r.due_time ? ` at ${fmtT(atTime(r.due_date, r.due_time))}` : '') : '');
const remSort = (a, b) => (a.due_date || '9').localeCompare(b.due_date || '9') || (a.due_time || '99').localeCompare(b.due_time || '99') || (b.priority - a.priority);
const remindersDue = () => openRems().filter((r) => isLate(r) || r.due_date === todayKey()).sort(remSort);
async function toggleRem(id) {
  const r = S.data.reminders.find((x) => x.id === id);
  if (!r) return;
  const prev = { done: r.done, done_at: r.done_at };
  r.done = !r.done; r.done_at = r.done ? new Date().toISOString() : null;
  render();
  try { await saveRow('reminders', r); } catch (e) { Object.assign(r, prev); render(); toast(e.message, true); }
}

// ---------- AI: triage + morning plan ----------
async function runTriage() {
  if (S.triaging || !S.google) return;
  const cutoff = Date.now() - 6 * 36e5, seen = new Set(), need = [];
  for (const e of S.events.values()) {
    if (e.meta || S.triaged.has(e.metaKey) || seen.has(e.metaKey) || e.end < cutoff) continue;
    seen.add(e.metaKey); need.push(e);
    if (need.length >= 40) break;
  }
  if (!need.length) return;
  S.triaging = true;
  need.forEach((e) => S.triaged.add(e.metaKey));
  let ok = true;
  try {
    const j = await api('/api/ai', { method: 'POST', body: { action: 'triage', events: need.map((e) => ({
      id: e.metaKey, title: e.title,
      when: e.allDay ? `${fmtDay(e.start)}, all day` : `${fmtDay(e.start)} ${fmtT(e.start)}-${fmtT(e.end)}`,
      category: catOf(e.colorId).name, location: e.location,
    })) } });
    const m = j.results || {};
    for (const e of S.events.values()) if (m[e.metaKey]) e.meta = m[e.metaKey];
    S.errors.ai = null;
  } catch (err) { ok = false; S.errors.ai = err.message; }
  S.triaging = false;
  render();
  if (ok) await runTriage();
}
function buildContext() {
  const now = new Date(), k = dayKey(now);
  const events = eventsOn(k).map((e) => {
    const l = leadOf(e);
    return {
      title: e.title,
      when: e.allDay ? 'all day' : `${fmtT(e.start)}-${fmtT(e.end)}`,
      category: catOf(e.colorId).name,
      priority: ['', 'low', 'normal', 'high'][pri(e)],
      ...(l ? { get_ready_by: fmtT(l.ready) } : {}),
      ...(l && l.travel ? { leave_by: fmtT(l.leave) } : {}),
      ...(e.meta?.prep_note ? { prep: e.meta.prep_note } : {}),
    };
  });
  return {
    date: `${WD[now.getDay()]}, ${MO[now.getMonth()]} ${now.getDate()}`,
    events,
    coming_up: headsUp().map(({ e, k: dk }) => ({ day: relDay(dk), title: e.title, prep: e.meta?.prep_note || '', prep_minutes: e.meta?.prep_min || 0 })),
    reminders: remindersDue().slice(0, 8).map((r) => ({ title: r.title, due: dueText(r), overdue: isLate(r) })),
    goals: activeGoals().map((g) => { const s = goalStatus(g); return { title: g.title, progress: s.text, status: s.pace, behind: s.behind }; }),
    open_time: freeGaps(k).map((g) => `${fmtT(g.s)}-${fmtT(g.e)}`),
  };
}
function hashOf(ctx) {
  const s = JSON.stringify(ctx.events) + JSON.stringify(ctx.coming_up);
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}
async function ensureBriefing(force = false) {
  if (!S.google || !S.eventsReady || S.triaging || S.briefingBusy) return;
  const k = todayKey();
  if (!force && S.briefing && S.briefing.day === k) return;
  S.briefingBusy = true; S.errors.brief = null; render();
  const ctx = buildContext();
  try {
    const j = await api('/api/ai', { method: 'POST', body: {
      action: 'briefing', day: k, force, hash: hashOf(ctx), context: ctx,
      now: new Date().toLocaleString([], { weekday: 'long', hour: 'numeric', minute: '2-digit' }),
    } });
    S.briefing = j.briefing; S.briefRevealed = false;
  } catch (err) { S.errors.brief = err.message; }
  S.briefingBusy = false;
  render();
}

// ---------- loading ----------
async function refreshAll() {
  S.lastLoad = Date.now();
  try {
    S.data = await api('/api/data');
    S.google = !!S.data.google?.connected;
    S.errors.boot = null;
  } catch (err) { S.errors.boot = err.message; render(); return; }
  if (S.briefing && S.briefing.day !== todayKey()) S.briefing = null;
  render();
  if (!S.google) { S.eventsReady = true; render(); return; }
  try {
    const now = new Date();
    await loadRange(addDays(sod(now), -1), addDays(sod(now), 8));
    S.errors.events = null;
  } catch (err) {
    S.errors.events = err.message;
    if (err.code === 'NOT_CONNECTED') S.google = false;
  }
  S.eventsReady = true;
  S.loadedWeeks.clear();
  render();
  await runTriage();
  ensureBriefing();
}
async function ensureWeek(ws) {
  const key = dayKey(ws);
  if (!S.google || S.loadedWeeks.has(key)) return;
  S.loadedWeeks.add(key);
  try { await loadRange(ws, addDays(ws, 7)); render(); runTriage(); }
  catch (err) { S.loadedWeeks.delete(key); toast(err.message, true); }
}

function viewGoals() {

function goalCard(g) {

  let mid = '';

    mid = `<div class="gnum"><span class="big">${esc(fmtNum(g.current, g.unit === '$' ? '$' : ''))}</span><span class="of">of ${esc(fmtNum(g.target, g.unit))}</span></div><div class="bar"><i style="width:${(s.pct * 100).toFixed(1)}%"></i></div>`;
  } else if (g.type === 'milestone') {

  } else {
    mid = `<div class="gnum"><span class="big">${g.frequency === 'weekly' ? `${s.n}/${s.need}` : s.n}</span><span class="of">${g.frequency === 'weekly' ? `this week${s.weeks > 1 ? `, ${s.weeks} weeks in a row` : ''}` : 'day streak'}</span></div>${streakDots(g, false)}`;
  }
  const quick = g.type === 'streak' ? `<button class="chk-btn${logsOf(g.id).some((l) => l.day === todayKey()) ? ' on' : ''}" data-act="goal-check" data-id="${g.id}">${logsOf(g.id).some((l) => l.day === todayKey()) ? 'Done today' : 'Check in'}</button>` : '';
  const due = g.deadline ? `Due ${fmtDay(parseDay(g.deadline))}` : '';
  return `<div class="goal glass" style="--c:${c}" role="button" tabindex="0" data-act="goal-open" data-id="${g.id}">
    <div class="gt"><i></i><h4>${esc(g.title)}</h4>${quick}</div>
    ${mid}
    <div class="gfoot"><span class="pace${s.behind ? ' behind' : ''}${/done/i.test(s.pace) ? ' done' : ''}">${esc(s.pace)}</span><span>${esc(due)}</span></div>
  </div>`;
}
function streakDots(g, tappable, span = 7) {
  const days = new Set(logsOf(g.id).map((l) => l.day));
  const start = g.frequency === 'weekly' && span === 7 ? sow(new Date()) : addDays(sod(new Date()), -(span - 1));
  const t = todayKey();
  let h = '';
  for (let i = 0; i < span; i++) {
    const d = addDays(start, i), k = dayKey(d);
    const inner = `<span class="${days.has(k) ? 'hit' : ''}${k === t ? ' today' : ''}">${WD[d.getDay()][0]}</span>`;

    h += tappable && !future ? `<button data-act="goal-day" data-id="${g.id}" data-k="${k}" aria-label="${fmtDay(d)}">${inner}</button>` : inner;

async function saveEventForm(btn) {

    ? { start: localIso(new Date(s - travel * 6e4)), end: start, title: `Drive: ${title}` } : null;

async function saveEventSheet(id, btn) {
  const e = S.events.get(id);
  if (!e) return;
  const meta = { priority: Number(segVal('es-pri')) || 2, prep_min: num('es-prep'), travel_min: num('es-travel'), prep_note: val('es-note') };
  const m0 = e.meta || {};
  const metaChanged = !e.meta || meta.priority !== m0.priority || meta.prep_min !== (m0.prep_min || 0) || meta.travel_min !== (m0.travel_min || 0) || meta.prep_note !== (m0.prep_note || '');
  const patch = {};
  const title = val('es-title');
  if (title && title !== e.title) patch.title = title;
  if (!e.allDay && $('#es-date')) {
    const s = atTime(val('es-date'), val('es-start'));
    let en = atTime(val('es-date'), val('es-end'));
    if (en <= s) en = addDays(en, 1);
    if (+s !== +e.start || +en !== +e.end) { patch.start = localIso(s); patch.end = localIso(en); }
  }
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    if (metaChanged) {
      const j = await api('/api/calendar', { method: 'POST', body: { action: 'meta', key: e.metaKey, meta } });
      for (const x of S.events.values()) if (x.metaKey === e.metaKey) x.meta = j.meta;
    }
    if (Object.keys(patch).length) {
      const j = await api('/api/calendar', { method: 'POST', body: { action: 'update', id, patch } });
      S.events.set(id, normEv(j.event));
    }
    closeSheet(); render(); toast('Saved');
  } catch (err) { btn.disabled = false; btn.textContent = 'Save changes'; toast(err.message, true); }
}

  'goal-edit': (el) => openGoalForm(el.dataset.id),
  'gf-save': (el) => saveGoalForm(el.dataset.id, el),
  'goal-check': (el) => { const g = goalById(el.dataset.id); if (g) toggleCheckin(g, todayKey()); },
  'goal-day': async (el) => { const g = goalById(el.dataset.id); if (g) { await toggleCheckin(g, el.dataset.k); openGoalSheet(g.id); } },
  async 'goal-archive'(el) {
    const g = goalById(el.dataset.id);
    if (!g || !confirm(`Archive "${g.title}"? It disappears from your goals.`)) return;
    g.archived = true; closeSheet(); render();
    try { await saveRow('goals', g); toast('Goal archived'); } catch (err) { g.archived = false; render(); toast(err.message, true); }
  },
  'gs-add': (el) => {
    const g = goalById(el.dataset.id);
    const raw = val('gs-add');
    const delta = raw === '' ? (+g.step || 1) : Number(raw);
    if (!g || !Number.isFinite(delta) || delta === 0) return;
    addToNumber(g, delta).then(() => openGoalSheet(g.id));
  },
  async 'ms-add'(el) {
    const title = val('ms-new');
    if (!title) return;
    const row = { id: uid(), goal_id: el.dataset.id, title, done: false, sort: msOf(el.dataset.id).length + 1 };
    upsertLocal('milestones', row); openGoalSheet(el.dataset.id); render();
    setTimeout(() => $('#ms-new')?.focus(), 50);
    try { await saveRow('milestones', row); } catch (err) { removeLocal('milestones', row.id); openGoalSheet(el.dataset.id); render(); toast(err.message, true); }
  },
  async 'ms-toggle'(el) {
    const m = S.data.milestones.find((x) => x.id === el.dataset.id);
    if (!m) return;
    m.done = !m.done; openGoalSheet(m.goal_id); render();
    try { await saveRow('milestones', m); } catch (err) { m.done = !m.done; openGoalSheet(m.goal_id); render(); toast(err.message, true); }
  },
  async 'ms-del'(el) {
    const m = S.data.milestones.find((x) => x.id === el.dataset.id);
    if (!m) return;
    removeLocal('milestones', m.id); openGoalSheet(m.goal_id); render();
    try { await delRow('milestones', m.id); } catch (err) { upsertLocal('milestones', m); openGoalSheet(m.goal_id); render(); toast(err.message, true); }
  },
  'tpl-edit': (el) => openTplForm(el.dataset.id || null),
  'tf-save': (el) => saveTplForm(el.dataset.id, el),
  async 'tf-delete'(el) {
    const t = S.data.templates.find((x) => x.id === el.dataset.id);
    if (!t || !confirm(`Delete the "${t.name}" template?`)) return;
    try { await delRow('templates', t.id); removeLocal('templates', t.id); openSettings(); toast('Template deleted'); } catch (err) { toast(err.message, true); }
  },
  async 'profile-save'(el) {
    const text = $('#st-profile').value.trim();
    el.disabled = true;
    try { const saved = await saveRow('settings', { id: 'profile', value: { text } }); upsertLocal('settings', saved); toast('Saved'); } catch (err) { toast(err.message, true); }
    el.disabled = false;
  },
};

function signOut() {
  localStorage.removeItem('launch.token');
  S.token = ''; S.data = null; S.events.clear(); S.briefing = null; S.eventsReady = false; S.triaged.clear();
  render();
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { A[el.dataset.act]?.(el, ev); return; }
  ev.preventDefault();
  A[el.dataset.act]?.(el, ev);
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') return closeSheet();
  if (ev.key !== 'Enter') return;
  if (ev.target.id === 'qa') { ev.preventDefault(); return quickAddRem(); }
  if (ev.target.id === 'pass') { ev.preventDefault(); return A.login($('[data-act="login"]')); }
  if (ev.target.id === 'ms-new') { ev.preventDefault(); return A['ms-add']($('[data-act="ms-add"]')); }
  if (ev.target.getAttribute('role') === 'button') { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'ef-start' && draft) { // keep the length when the start moves
    const len = draft.tpl?.duration_min || 60;
    const s = atTime(val('ef-date') || todayKey(), ev.target.value || '00:00');
    $('#ef-end').value = hhmm(new Date(s.getTime() + len * 6e4));
  }
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.token) { setSky(); if (Date.now() - S.lastLoad > 5 * 60e3) refreshAll(); else render(); }
});
setInterval(() => { if (S.token && !document.hidden && !$('#sheet').classList.contains('show') && S.view !== 'reminders') render(); }, 60e3);

function handleQuery() {
  const p = new URLSearchParams(location.search);
  if (p.get('google') === 'connected') setTimeout(() => toast('Google Calendar connected'), 300);
  if (p.get('google') === 'error') setTimeout(() => toast(p.get('msg') || 'Google sign-in failed.', true), 300);
  if (p.has('google')) history.replaceState(null, '', '/');
}

setSky();
handleQuery();
render();
if (S.token) refreshAll();
</script>
</body>
</html>
